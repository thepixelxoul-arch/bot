<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Packages - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; min-height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            position: sticky; top: 0;
        }
        .header-left { display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 20px; }
        
        .header-vip-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            white-space: nowrap;
        }

        .content { flex-grow: 1; padding: 20px 0; overflow-y: auto; padding-bottom: 80px; }
        
        /* পিংক ভিআইপি কার্ড স্টাইল */
        .vip-huge-card {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink));
            border-radius: 12px;
            padding: 35px 20px 25px 20px;
            margin: 0 auto 20px auto; 
            color: white;
            box-shadow: 0 6px 15px rgba(226, 0, 90, 0.25);
            width: 92%; 
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* বামদিকের ওপরের হলুদ ব্যাজ */
        .vip-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ffcc00;
            color: #333;
            font-size: 11px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ডানদিকের কোণায় থাকা প্রাইস ট্যাগ */
        .vip-price-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            color: white;
        }

        .vip-price-tag .old-price {
            text-decoration: line-through; 
            color: rgba(255, 255, 255, 0.7); 
            font-size: 13px; 
            font-weight: normal;
        }

        .vip-icon-circle {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .vip-huge-card h3 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        /* প্যারাগ্রাফ স্টাইল */
        .vip-huge-card p {
            font-size: 13px;
            color: #ffffff;
            margin: 0 0 20px 0;
            font-weight: bold;
            line-height: 1.5;
            padding: 0 5px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .buy-btn-white {
            background-color: var(--main-white);
            color: var(--main-pink);
            border: none;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            flex: 1;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            white-space: nowrap;
        }
        .buy-btn-white:hover { background-color: var(--bg-light); transform: translateY(-2px); }

        .bonus-btn-pink {
            background-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            cursor: not-allowed;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
            white-space: nowrap;
        }

        /* হলুদ রঙের অ্যাক্টিভ বোনাস বাটন */
        .bonus-btn-pink.active-bonus {
            background: #ffcc00; 
            color: #333; 
            border: none; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .bonus-btn-pink.active-bonus i { color: #d35400; }
        .bonus-btn-pink.active-bonus:hover { background: #ffdb4d; transform: translateY(-2px); }

        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: sticky; bottom: 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }

        .toast-msg {
            visibility: hidden; min-width: 250px; background-color: var(--main-pink);
            color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
            position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%);
            top: 20px; font-size: 13px; font-weight: bold; line-height: 1.4;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.4); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; top: 40px; }
    </style>
</head>
<body>

    <div id="toastBox" class="toast-msg"></div>

    <div class="app-container">
        <!-- Header Section -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="header-title">VIP Packages</div>
            </div>
            
            <div id="headerVipBadge" class="header-vip-badge">
                <i class="fas fa-user"></i> <span id="headerVipText">লোড হচ্ছে...</span>
            </div>
        </div>

        <div class="content">
            
            <!-- ইউজারের বর্তমান লেভেলের কার্ড -->
            <div class="vip-huge-card" style="margin-bottom: 35px; border-bottom: 4px dashed rgba(255,255,255,0.3); padding-top: 25px;">
                <div style="font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.2); display: inline-block; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px;">আপনার বর্তমান লেভেল</div>
                <div class="vip-icon-circle" style="margin: 0 auto 10px auto;"><i class="fas fa-user" id="vipIcon"></i></div>
                <div style="text-align: center; width: 100%;">
                    <h3 id="currentVipDisplay" style="font-size: 22px;">প্যাকেজ লোড হচ্ছে...</h3>
                    <div id="vipDescText" style="padding: 0 10px; font-size: 14px; font-weight: bold; line-height: 1.6;">দয়া করে অপেক্ষা করুন...</div>
                </div>
            </div>

            <!-- ডায়নামিক প্যাকেজগুলো এখানে লোড হবে -->
            <div id="vipPackagesContainer"></div>

        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Dynamic Rendering Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const defaultPackages = [
            { id: "VIP 1", oldPrice: 200, price: 99, emails: 20, instas: 10, bonus: 9, icon: "fa-crown", btnId: "bonus-btn-1" },
            { id: "VIP 2", oldPrice: 300, price: 199, emails: 30, instas: 20, bonus: 18, icon: "fa-crown", btnId: "bonus-btn-2" },
            { id: "VIP 3", oldPrice: 400, price: 299, emails: 40, instas: 30, bonus: 27, icon: "fa-crown", btnId: "bonus-btn-3" },
            { id: "VIP 4", oldPrice: 500, price: 399, emails: 50, instas: 40, bonus: 36, icon: "fa-crown", btnId: "bonus-btn-4" },
            { id: "VIP 5", oldPrice: 600, price: 499, emails: 60, instas: 50, bonus: 45, icon: "fa-crown", btnId: "bonus-btn-5" },
            { id: "VIP 6", oldPrice: 700, price: 599, emails: 70, instas: 60, bonus: 54, icon: "fa-crown", btnId: "bonus-btn-6" },
            { id: "VIP 7", oldPrice: 800, price: 699, emails: 80, instas: 70, bonus: 63, icon: "fa-crown", btnId: "bonus-btn-7" },
            { id: "VIP 8", oldPrice: 900, price: 799, emails: 90, instas: 80, bonus: 72, icon: "fa-crown", btnId: "bonus-btn-8" },
            { id: "VIP 9", oldPrice: 1000, price: 899, emails: 100, instas: 90, bonus: 81, icon: "fa-crown", btnId: "bonus-btn-9" },
            { id: "VIP 10", oldPrice: 1100, price: 999, emails: 110, instas: 100, bonus: 90, icon: "fa-crown", btnId: "bonus-btn-10" },
            { id: "Send bKash Member", oldPrice: 2500, price: 2000, emails: 200, instas: 180, bonus: 100, icon: "fa-star", btnId: "bonus-btn-sendbkash" },
            { id: "Send bKash Member 2", oldPrice: 3500, price: 3000, emails: 300, instas: 280, bonus: 150, icon: "fa-star", btnId: "bonus-btn-sendbkash2" },
            { id: "Send bKash Member 3", oldPrice: 4500, price: 4000, emails: 400, instas: 380, bonus: 200, icon: "fa-star", btnId: "bonus-btn-sendbkash3" },
            { id: "Send bKash Member 4", oldPrice: 5500, price: 5000, emails: 500, instas: 480, bonus: 250, icon: "fa-star", btnId: "bonus-btn-sendbkash4" },
            { id: "Send bKash Member 5", oldPrice: 6500, price: 6000, emails: 600, instas: 580, bonus: 300, icon: "fa-star", btnId: "bonus-btn-sendbkash5" }
        ];

        // ডায়নামিক রেন্ডারিং এবং সর্টিং ফাংশন
        function renderVipPackages() {
            let currentVip = localStorage.getItem('userVipLevel');
            if (!currentVip || currentVip === "VIP 0") {
                currentVip = "প্যাকেজ নেই";
            }

            const adminPackages = JSON.parse(localStorage.getItem('adminVipPackages')) || defaultPackages;
            window.adminVipData = adminPackages; 
            
            const container = document.getElementById('vipPackagesContainer');
            container.innerHTML = '';

            // যে প্যাকেজটি ইউজারের কেনা আছে, সেটি লিস্টের একদম ওপরে আনার লজিক
            const sortedPackages = [...adminPackages].sort((a, b) => {
                if (a.id === currentVip) return -1;
                if (b.id === currentVip) return 1;
                return 0;
            });

            sortedPackages.forEach(pkg => {
                const titleText = pkg.id.includes("VIP") ? `${pkg.id} স্পেশাল অফার` : pkg.id;
                
                container.innerHTML += `
                <div class="vip-huge-card">
                    <div class="vip-badge">সুবিধা</div>
                    <div class="vip-price-tag"><span class="old-price">৳${pkg.oldPrice}</span> ৳${pkg.price}</div>
                    
                    <div class="vip-icon-circle"><i class="fas ${pkg.icon}"></i></div>
                    <h3>${titleText}</h3>
                    <p>মাত্র ৳${pkg.price} টাকায় কিনুন! দৈনিক ${pkg.emails}টি জিমেইল ও ${pkg.instas}টি ইনস্টাগ্রাম কাজ।</p>
                    
                    <div class="card-actions">
                        <button class="buy-btn-white" onclick="requestUpgrade('${pkg.id}', ${pkg.price})">৳${pkg.price} দিয়ে কিনুন</button>
                        <button class="bonus-btn-pink" id="${pkg.btnId}" onclick="claimBonus('${pkg.id}', ${pkg.bonus})"><i class="fas fa-gift"></i> বোনাস: ৳${pkg.bonus}</button>
                    </div>
                </div>
                `;
            });

            // রেন্ডার হওয়ার পর বাটন কালার চেক করবে
            if(window.checkBonusStatus) {
                window.checkBonusStatus();
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                let currentVip = localStorage.getItem('userVipLevel');
                if (!currentVip || currentVip === "VIP 0") {
                    currentVip = "প্যাকেজ নেই"; 
                }
                
                // প্রথমে প্যাকেজগুলো রেন্ডার করা (সর্টিং সহ)
                renderVipPackages();

                // হেডার আপডেট
                const headerBadgeText = document.getElementById("headerVipText");
                const headerBadgeIcon = document.querySelector("#headerVipBadge i");
                if(headerBadgeText) headerBadgeText.innerText = currentVip;

                // বর্তমান লেভেল কার্ড আপডেট
                document.getElementById("currentVipDisplay").innerText = currentVip;
                const descElem = document.getElementById("vipDescText");
                const iconElem = document.getElementById("vipIcon");
                
                if (currentVip.includes("bKash Member")) {
                    if(headerBadgeIcon) headerBadgeIcon.className = "fas fa-star";
                    if(iconElem) iconElem.className = "fas fa-star";
                } else if (currentVip === "প্যাকেজ নেই") {
                    if(headerBadgeIcon) headerBadgeIcon.className = "fas fa-user";
                    if(iconElem) iconElem.className = "fas fa-user";
                } else {
                    if(headerBadgeIcon) headerBadgeIcon.className = "fas fa-crown";
                    if(iconElem) iconElem.className = "fas fa-crown";
                }

                // ডাটাবেস থেকে ইউজারের লেভেলের বিবরণ ফেচ করা
                const activePkg = window.adminVipData.find(p => p.id === currentVip);
                if (activePkg) {
                    descElem.innerHTML = `সাপ্তাহিক বোনাস: ৳${activePkg.bonus} <br> দৈনিক কাজ: ${activePkg.emails}টি জিমেইল ও ${activePkg.instas}টি ইনস্টাগ্রাম।`;
                } else {
                    descElem.innerHTML = "অ্যাকাউন্টে কোনো প্যাকেজ নেই, প্যাকেজ কিনুন।";
                }
            }
        });
    </script>

    <script>
        function requestUpgrade(vipLevel, price) {
            window.location.href = `payment.html?vip=${encodeURIComponent(vipLevel)}&amount=${price}`;
        }

        window.checkBonusStatus = function() {
            const currentVip = localStorage.getItem('userVipLevel') || "VIP 0";
            const adminPackages = window.adminVipData || [];
            
            adminPackages.forEach(pkg => {
                const btn = document.getElementById(pkg.btnId);
                if (!btn) return;
                
                // যদি ইউজারের এই প্যাকেজটি কেনা থাকে
                if (currentVip === pkg.id) {
                    const lastClaim = localStorage.getItem(`lastBonusClaim_${pkg.id}`);
                    const now = new Date().getTime();
                    const oneWeek = 7 * 24 * 60 * 60 * 1000;
                    
                    // যদি বোনাস নেওয়ার সময় হয়, তবে বাটনটি হলুদ (active-bonus) হয়ে যাবে
                    if (!lastClaim || (now - parseInt(lastClaim)) >= oneWeek) {
                        btn.classList.add('active-bonus');
                    } else {
                        btn.classList.remove('active-bonus'); 
                    }
                } else {
                    btn.classList.remove('active-bonus');
                }
            });
        }

        window.claimBonus = function(vipName, amount) {
            const currentVip = localStorage.getItem('userVipLevel') || "VIP 0";
            const toast = document.getElementById("toastBox");
            toast.className = "toast-msg";

            if (currentVip !== vipName) {
                toast.innerText = `এই বোনাসটি শুধুমাত্র ${vipName} মেম্বারদের জন্য!`;
                toast.classList.add("show");
                setTimeout(() => { toast.classList.remove("show"); }, 3500);
                return;
            }

            const lastClaimKey = 'lastBonusClaim_' + vipName;
            const lastClaimTime = localStorage.getItem(lastClaimKey);
            const currentTime = new Date().getTime();
            const oneWeek = 7 * 24 * 60 * 60 * 1000;

            if (lastClaimTime && (currentTime - parseInt(lastClaimTime)) < oneWeek) {
                toast.innerText = `আপনি ইতিমধ্যে এই সপ্তাহের বোনাস নিয়েছেন! আগামী সপ্তাহে আবার চেষ্টা করুন।`;
                toast.classList.add("show");
            } else {
                localStorage.setItem(lastClaimKey, currentTime.toString());
                
                toast.innerText = `অভিনন্দন! আপনার একাউন্টে ৳${amount} সাপ্তাহিক বোনাস যুক্ত হয়েছে।`;
                toast.classList.add("show");
                
                window.checkBonusStatus();
            }
            
            setTimeout(() => { toast.classList.remove("show"); }, 3500);
        }
    </script>
</body>
</html>
