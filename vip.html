<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Packages - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; min-height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            position: sticky; top: 0;
        }
        .header-left { display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 20px; }
        
        .header-vip-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            white-space: nowrap;
        }

        .content { flex-grow: 1; padding: 20px 0; overflow-y: auto; padding-bottom: 80px; }
        
        .vip-huge-card {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink));
            border-radius: 12px;
            padding: 35px 20px 25px 20px;
            margin: 0 auto 20px auto; 
            color: white;
            box-shadow: 0 6px 15px rgba(226, 0, 90, 0.25);
            width: 92%; 
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .vip-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ffcc00;
            color: #333;
            font-size: 11px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .vip-price-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            color: white;
        }

        .vip-price-tag .old-price {
            text-decoration: line-through; 
            color: rgba(255, 255, 255, 0.7); 
            font-size: 13px; 
            font-weight: normal;
        }

        .vip-icon-circle {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .vip-huge-card h3 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        .vip-huge-card p {
            font-size: 13px;
            color: #ffffff;
            margin: 0 0 20px 0;
            font-weight: bold;
            line-height: 1.5;
            padding: 0 5px;
            white-space: pre-line;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .buy-btn-white {
            background-color: var(--main-white);
            color: var(--main-pink);
            border: none;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            flex: 1;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            white-space: nowrap;
        }
        .buy-btn-white:hover { background-color: var(--bg-light); transform: translateY(-2px); }

        .bonus-btn-pink {
            background-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            cursor: not-allowed;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
            white-space: nowrap;
        }

        .bonus-btn-pink.active-bonus {
            background: #ffcc00; color: #333; border: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .bonus-btn-pink.active-bonus i { color: #d35400; }
        .bonus-btn-pink.active-bonus:hover { background: #ffdb4d; transform: translateY(-2px); }

        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: sticky; bottom: 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }

        .toast-msg {
            visibility: hidden; min-width: 250px; background-color: var(--main-pink);
            color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
            position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%);
            top: 20px; font-size: 13px; font-weight: bold; line-height: 1.4;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.4); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; top: 40px; }
        .toast-error { background-color: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
    </style>
</head>
<body>

    <div id="toastBox" class="toast-msg"></div>

    <div class="app-container">
        <!-- Header Section -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="header-title">VIP Packages</div>
            </div>
            
            <div id="headerVipBadge" class="header-vip-badge">
                <i class="fas fa-spinner fa-spin" id="headerIcon"></i> <span id="headerVipText">লোড হচ্ছে...</span>
            </div>
        </div>

        <div class="content">
            
            <div id="vipPackagesContainer">
                <p style="text-align:center; color:#888; padding:30px;"><i class="fas fa-spinner fa-spin"></i> প্যাকেজ লোড হচ্ছে...</p>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.increment = increment;
        
        window.currentUser = null;
        window.userData = {};

        const defaultPackages = [
            { id: "VIP 1", price: 500, bonus: 9, desc: "• প্রতিদিন ৫টি কাজ জমা দেওয়ার সুযোগ।\n• উইথড্র রিকোয়েস্ট ১২ ঘণ্টার মধ্যে।" },
            { id: "VIP 2", price: 1000, bonus: 18, desc: "• প্রতিদিন ১০টি কাজ জমা দেওয়ার সুযোগ।\n• উইথড্র রিকোয়েস্ট ৬ ঘণ্টার মধ্যে।\n• ডেডিকেটেড সাপোর্ট।" },
            { id: "VIP 3", price: 2000, bonus: 27, desc: "• আনলিমিটেড কাজ জমা দেওয়ার সুযোগ।\n• ইনস্ট্যান্ট উইথড্র (১ ঘন্টার মধ্যে)।\n• ডিরেক্ট এডমিন সাপোর্ট।" },
            { id: "VIP 4", price: 5000, bonus: 36, desc: "• প্রতিদিন ২০০+ কাজের সুযোগ।\n• এক্সট্রা ১০% বোনাস প্রতি কাজে।\n• ইনস্ট্যান্ট উইথড্র।" },
            { id: "VIP 5", price: 10000, bonus: 45, desc: "• প্রিমিয়াম লেভেল টাস্ক।\n• স্পেশাল উইকএন্ড বোনাস।\n• অটো-উইথড্র সিস্টেম।" },
            { id: "VIP 6", price: 15000, bonus: 54, desc: "• এলিট মেম্বার ব্যাজ।\n• প্রতি রেফারে ডাবল ইনকাম।" },
            { id: "VIP 7", price: 20000, bonus: 63, desc: "• হাইয়েস্ট রেট টাস্ক।\n• নো উইথড্র ফি।" },
            { id: "VIP 8", price: 25000, bonus: 72, desc: "• স্পেশাল গিফট প্রতি মাসে।\n• প্রাইভেট টেলিগ্রাম গ্রুপ এক্সেস।" },
            { id: "VIP 9", price: 30000, bonus: 81, desc: "• লাইফটাইম ভ্যালিডিটি।\n• সব ফিচারে ফুল এক্সেস।" },
            { id: "VIP 10", price: 50000, bonus: 90, desc: "• কোম্পানির শেয়ার হোল্ডার প্রফিট।\n• ডিরেক্ট কল সাপোর্ট।\n• আনলিমিটেড সব কিছু!" },
            { id: "Member 1", price: 7500, bonus: 50, desc: "• মেম্বারশিপ প্যাকেজ ১ এর বিশেষ সুবিধাসমূহ।" },
            { id: "Member 2", price: 12500, bonus: 100, desc: "• মেম্বারশিপ প্যাকেজ ২ এর বিশেষ সুবিধাসমূহ।" },
            { id: "Member 3", price: 9999, bonus: 12000, desc: "• মেম্বারশিপ প্যাকেজ ৩ এর স্পেশাল অফার।\n• লাইফটাইম সাপোর্ট।" },
            { id: "Member 4", price: 14999, bonus: 18000, desc: "• মেম্বারশিপ প্যাকেজ ৪ এর স্পেশাল অফার।\n• এক্সট্রা বোনাস।" },
            { id: "Member 5", price: 19999, bonus: 25000, desc: "• মেম্বারশিপ প্যাকেজ ৫ এর স্পেশাল অফার।\n• সর্বোচ্চ রেট।" }
        ];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                
                // ইউজারের ডাটা ফায়ারবেস থেকে লোড করা
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        window.userData = docSnap.data();
                        
                        const currentVip = window.userData.vipLevel && window.userData.vipLevel !== "VIP 0" ? window.userData.vipLevel : "প্যাকেজ নেই";
                        document.getElementById("headerVipText").innerText = currentVip;
                        const icon = document.getElementById("headerIcon");
                        icon.className = currentVip.includes("Member") ? "fas fa-star" : (currentVip === "প্যাকেজ নেই" ? "fas fa-user" : "fas fa-crown");
                        
                        loadVipPackages(currentVip);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function loadVipPackages(userCurrentVip) {
            onSnapshot(doc(db, "admin_settings", "vip_packages"), (docSnap) => {
                const container = document.getElementById('vipPackagesContainer');
                container.innerHTML = '';
                
                let dbData = docSnap.exists() ? docSnap.data() : {};
                
                // ইউজারের বর্তমান প্যাকেজটি সবার উপরে রাখার জন্য সর্টিং
                const sortedPackages = [...defaultPackages].sort((a, b) => {
                    let aIdMatch = a.id === userCurrentVip || (a.id.includes("Member") && userCurrentVip.includes(a.id));
                    let bIdMatch = b.id === userCurrentVip || (b.id.includes("Member") && userCurrentVip.includes(b.id));
                    
                    if (aIdMatch) return -1;
                    if (bIdMatch) return 1;
                    return 0;
                });

                sortedPackages.forEach(pkg => {
                    const priceId = pkg.id.replace(/\s+/g, '').toLowerCase(); // e.g., vip1, member1
                    
                    const currentPrice = dbData[priceId]?.price || pkg.price;
                    const currentBonus = dbData[priceId]?.bonus || pkg.bonus;
                    const currentDesc = dbData[priceId]?.desc || pkg.desc;
                    const oldPriceCalc = currentPrice + (currentPrice * 0.2); // ডেমো Old Price (২০% বেশি)

                    const iconClass = pkg.id.includes('Member') ? 'fa-star' : 'fa-crown';
                    const titleText = pkg.id.includes('VIP') ? `${pkg.id} স্পেশাল অফার` : `Send bKash ${pkg.id}`;

                    container.innerHTML += `
                    <div class="vip-huge-card">
                        <div class="vip-badge">সুবিধা</div>
                        <div class="vip-price-tag"><span class="old-price">৳${oldPriceCalc.toFixed(0)}</span> ৳${currentPrice}</div>
                        
                        <div class="vip-icon-circle"><i class="fas ${iconClass}"></i></div>
                        <h3>${titleText}</h3>
                        <p>${currentDesc}</p>
                        
                        <div class="card-actions">
                            <button class="buy-btn-white" onclick="requestUpgrade('${pkg.id}', ${currentPrice})">৳${currentPrice} দিয়ে কিনুন</button>
                            <button class="bonus-btn-pink" id="bonus-btn-${priceId}" onclick="claimBonus('${pkg.id}', ${currentBonus}, '${priceId}')"><i class="fas fa-gift"></i> বোনাস: ৳${currentBonus}</button>
                        </div>
                    </div>
                    `;
                });

                window.checkBonusStatus(userCurrentVip, dbData);
            });
        }

    </script>

    <!-- UI Scripts -->
    <script>
        function showToast(message, isError = false) {
            const toast = document.getElementById("toastBox");
            toast.innerText = message;
            if(isError) toast.classList.add("toast-error");
            else toast.classList.remove("toast-error");
            
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3500);
        }

        window.requestUpgrade = function(vipLevel, price) {
            window.location.href = `payment.html?vip=${encodeURIComponent(vipLevel)}&amount=${price}`;
        }

        window.checkBonusStatus = function(userCurrentVip, dbData) {
            if(!window.userData) return;
            
            const adminPackages = [
                "vip1", "vip2", "vip3", "vip4", "vip5", "vip6", "vip7", "vip8", "vip9", "vip10",
                "member1", "member2", "member3", "member4", "member5"
            ];
            
            adminPackages.forEach(priceId => {
                const btn = document.getElementById(`bonus-btn-${priceId}`);
                if (!btn) return;
                
                // ইউজারের লেভেল চেক করা
                let isMatch = false;
                if (userCurrentVip === priceId.toUpperCase().replace('VIP', 'VIP ')) isMatch = true;
                if (userCurrentVip.includes(priceId.replace('member', 'Member '))) isMatch = true;
                
                if (isMatch) {
                    const lastClaimKey = 'lastBonusClaim_' + priceId;
                    const lastClaimTime = window.userData[lastClaimKey] || 0;
                    const now = new Date().getTime();
                    const oneWeek = 7 * 24 * 60 * 60 * 1000;
                    
                    if ((now - lastClaimTime) >= oneWeek) {
                        btn.classList.add('active-bonus');
                    } else {
                        btn.classList.remove('active-bonus'); 
                    }
                } else {
                    btn.classList.remove('active-bonus');
                }
            });
        }

        window.claimBonus = async function(vipName, amount, priceId) {
            if(!window.currentUser || !window.userData) {
                showToast("অনুগ্রহ করে অপেক্ষা করুন...", true);
                return;
            }

            const userCurrentVip = window.userData.vipLevel || "VIP 0";
            let isMatch = false;
            if (userCurrentVip === vipName || userCurrentVip.includes(vipName)) isMatch = true;

            if (!isMatch) {
                showToast(`এই বোনাসটি শুধুমাত্র ${vipName} মেম্বারদের জন্য!`, true);
                return;
            }

            const lastClaimKey = 'lastBonusClaim_' + priceId;
            const lastClaimTime = window.userData[lastClaimKey] || 0;
            const currentTime = new Date().getTime();
            const oneWeek = 7 * 24 * 60 * 60 * 1000;

            if ((currentTime - lastClaimTime) < oneWeek) {
                showToast(`আপনি ইতিমধ্যে এই সপ্তাহের বোনাস নিয়েছেন! আগামী সপ্তাহে আবার চেষ্টা করুন।`, true);
                return;
            }

            const btn = document.getElementById(`bonus-btn-${priceId}`);
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                // ফায়ারবেসে ইউজারের ব্যালেন্স এবং ক্লেইম টাইম আপডেট করা
                await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid), {
                    balance: window.increment(amount),
                    [lastClaimKey]: currentTime
                });
                
                showToast(`অভিনন্দন! আপনার একাউন্টে ৳${amount} সাপ্তাহিক বোনাস যুক্ত হয়েছে।`);
            } catch(e) {
                console.error(e);
                showToast("বোনাস নিতে সমস্যা হয়েছে!", true);
                btn.innerHTML = `<i class="fas fa-gift"></i> বোনাস: ৳${amount}`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
