<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            min-height: 100vh; 
            background-color: var(--bg-light); 
            color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            box-sizing: border-box;
        }

        .header { 
            background-color: var(--main-pink); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--main-white); 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); 
            z-index: 10; 
        }

        .header-title { 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            margin-right: 15px; 
            font-size: 22px; 
        }

        .content { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            padding-bottom: 30px;
        }

        .balance-card {
            background-color: var(--main-white);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .balance-card h3 {
            margin: 0 0 5px 0;
            color: var(--text-grey);
            font-size: 14px;
        }

        .balance-card h1 {
            margin: 0;
            color: var(--main-pink);
            font-size: 28px;
        }

        .withdraw-form {
            background-color: var(--main-white);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #2c3e50;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group select, .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .input-group select:focus, .input-group input:focus {
            border-color: var(--main-pink);
        }

        .withdraw-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--main-pink);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .withdraw-btn:hover {
            background-color: #c4004e;
        }

        /* প্রোফাইল পেজের মতো ছোট এবং নিখুঁত বটম নেভবার */
        .bottom-nav { 
            background-color: var(--main-white); 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            border-top: 1px solid #eaeaea; 
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 10; 
        }

        .nav-item { 
            text-align: center; 
            font-size: 11px; 
            color: var(--text-grey); 
            cursor: pointer; 
            flex: 1; 
            text-decoration: none; 
        }

        .nav-item i { 
            font-size: 18px; 
            margin-bottom: 4px; 
            display: block; 
        }

        .nav-item.active { 
            color: var(--main-pink); 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Withdraw
            </div>
            <div><i class="fas fa-wallet"></i></div>
        </div>

        <div class="content">
            
            <div class="balance-card">
                <h3>আপনার বর্তমান ব্যালেন্স</h3>
                <h1>৳৫০.০০</h1>
            </div>

            <div class="withdraw-form">
                <div class="input-group">
                    <label>পেমেন্ট মেথড সিলেক্ট করুন</label>
                    <select id="method">
                        <option value="bkash">bKash (Personal)</option>
                        <option value="nagad">Nagad (Personal)</option>
                        <option value="rocket">Rocket (Personal)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>আপনার অ্যাকাউন্ট নম্বর</label>
                    <input type="text" id="accountNo" placeholder="017XXXXXXXX" required>
                </div>

                <div class="input-group">
                    <label>টাকার পরিমাণ (Withdraw Amount)</label>
                    <input type="number" id="amount" placeholder="ন্যূনতম ৳১০০" required>
                </div>

                <button class="withdraw-btn" id="withdrawBtn">উইথড্র রিকোয়েস্ট পাঠান</button>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item active"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Withdraw Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66",
            measurementId: "G-ZSRNS5RPV5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        document.getElementById("withdrawBtn").addEventListener("click", () => {
            const number = document.getElementById("accountNo").value;
            const amount = document.getElementById("amount").value;

            if (number && amount) {
                if (amount < 100) {
                    alert("সর্বনিম্ন ১০০ টাকা উইথড্র করতে পারবেন!");
                    return;
                }
                alert("সফলভাবে উইথড্র রিকোয়েস্ট পাঠানো হয়েছে!");
                document.getElementById("accountNo").value = "";
                document.getElementById("amount").value = "";
            } else {
                alert("দয়া করে সব ঘরগুলো পূরণ করুন!");
            }
        });
    </script>
</body>
</html>
