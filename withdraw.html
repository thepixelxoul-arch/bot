<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
            overflow: hidden; 
        }

        .header { 
            flex-shrink: 0; 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
        }
        .header-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 22px; }

        .history-btn-header {
            color: white;
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .history-btn-header:hover {
            transform: scale(1.1);
        }

        .content { 
            flex-grow: 1; padding: 20px; 
            overflow-y: auto; overflow-x: hidden; 
            padding-bottom: 20px; 
        }
        
        .notice-box {
            background: linear-gradient(135deg, #fff3cd, #ffeeba); 
            border: 1px solid #ffeeba; border-left: 5px solid #ffc107;
            padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; color: #856404;
            font-size: 13px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .task-card {
            background-color: var(--main-white); border-radius: 10px; padding: 20px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .data-group { margin-bottom: 18px; }
        .data-group label { display: block; font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        
        .method-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .method-box {
            background: var(--main-white);
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .method-box i {
            font-size: 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(226, 0, 90, 0.1);
            color: var(--main-pink);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            transition: 0.3s;
        }
        .method-box span {
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }

        .method-box.selected {
            border: 1.5px solid var(--main-pink);
            background-color: rgba(226, 0, 90, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(226, 0, 90, 0.15);
        }
        .method-box.selected i {
            background: linear-gradient(135deg, var(--main-pink), #ff3377);
            color: white;
            box-shadow: 0 2px 8px rgba(226, 0, 90, 0.3);
        }

        .whatsapp-input {
            width: 100%; padding: 14px; border: 1.5px solid #eaeaea;
            border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none;
            color: #2c3e50; background-color: #f8f9fa; font-weight: 500;
            transition: 0.3s;
        }
        .whatsapp-input:focus { border-color: var(--main-pink); background-color: white; box-shadow: 0 0 0 3px rgba(226, 0, 90, 0.1); }

        .submit-btn {
            background-color: var(--main-pink); color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 15px; font-weight: bold;
            width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(226, 0, 90, 0.25);
            margin-top: 10px; transition: 0.2s;
        }
        .submit-btn:hover { background-color: #c4004e; transform: translateY(-1px); }
        .submit-btn:disabled { background-color: #dcdde1; cursor: not-allowed; box-shadow: none; transform: none; }

        /* ফুল-স্ক্রিন হিস্ট্রি পেজ স্টাইল */
        .history-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-light);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .history-screen.active {
            transform: translateX(0);
        }

        .history-card {
            background-color: var(--main-white); border: 1px solid #eaeaea; border-radius: 8px; 
            padding: 12px 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); gap: 10px;
        }
        .history-left-wrap {
            display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden;
        }
        .history-icon { 
            min-width: 45px; height: 45px; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; color: white; 
            background: linear-gradient(135deg, var(--main-pink), #ff3377);
            box-shadow: 0 4px 10px rgba(226, 0, 90, 0.2);
        }
        .history-info { flex: 1; overflow: hidden; }
        .history-info p { 
            margin: 0 0 4px 0; color: #2c3e50; font-size: 14px; font-weight: bold; 
            word-wrap: break-word; word-break: break-all; 
        }
        .history-info small { color: var(--text-grey); font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 4px;}
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-approved { background-color: rgba(39, 174, 96, 0.1); color: #27ae60; }
        .status-rejected { background-color: rgba(231, 76, 60, 0.1); color: #e74c3c; }

        .bottom-nav { 
            flex-shrink: 0; 
            background-color: var(--main-white); display: flex; justify-content: space-around; 
            padding: 10px 0; border-top: 1px solid #eaeaea; z-index: 100; 
        }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }

        .toast-msg {
            visibility: hidden; min-width: 200px; background-color: var(--main-pink);
            color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
            position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%);
            top: 20px; font-size: 14px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.4); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; top: 40px; }
        .toast-error { background-color: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
    </style>
</head>
<body>

    <div id="toastBox" class="toast-msg"></div>

    <div class="app-container">
        <!-- Main Header -->
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Withdraw
            </div>
            <!-- ডানদিকের হিস্ট্রি বাটন -->
            <a href="#" class="history-btn-header" onclick="openHistoryScreen(event)">
                <i class="fas fa-history"></i>
            </a>
        </div>

        <!-- Main Content (উইথড্র ফর্ম) -->
        <div class="content">
            <div class="notice-box">
                <i class="fas fa-info-circle"></i> ন্যূনতম উইথড্র পরিমাণ ৳১০০ টাকা। ২৪ ঘণ্টার মধ্যে পেমেন্ট কমপ্লিট করা হবে।
            </div>

            <div class="task-card">
                <div class="data-group">
                    <label>পেমেন্ট মেথড সিলেক্ট করুন</label>
                    <div class="method-grid">
                        <div class="method-box selected" onclick="selectMethod(this, 'bKash')">
                            <i class="fas fa-wallet"></i>
                            <span>bKash</span>
                        </div>
                        <div class="method-box" onclick="selectMethod(this, 'Nagad')">
                            <i class="fas fa-wallet"></i>
                            <span>Nagad</span>
                        </div>
                        <div class="method-box" onclick="selectMethod(this, 'Rocket')">
                            <i class="fas fa-wallet"></i>
                            <span>Rocket</span>
                        </div>
                        <div class="method-box" onclick="selectMethod(this, 'Upay')">
                            <i class="fas fa-wallet"></i>
                            <span>Upay</span>
                        </div>
                    </div>
                </div>

                <div class="data-group">
                    <label>একাউন্ট নাম্বার (Account Number)</label>
                    <input type="number" id="accNumber" class="whatsapp-input" placeholder="আপনার নাম্বার দিন">
                </div>

                <div class="data-group">
                    <label>টাকার পরিমাণ (Amount)</label>
                    <input type="number" id="withdrawAmount" class="whatsapp-input" placeholder="৳ পরিমাণ লিখুন">
                </div>

                <!-- পাসওয়ার্ড বক্স -->
                <div class="data-group">
                    <label>অ্যাকাউন্ট পাসওয়ার্ড</label>
                    <input type="password" id="withdrawPassword" class="whatsapp-input" placeholder="আপনার পাসওয়ার্ড দিন">
                    <small style="color: var(--text-grey); font-size: 11px; display: block; margin-top: 6px;">টাকা উত্তোলনের জন্য আপনার বর্তমান পাসওয়ার্ডটি প্রয়োজন।</small>
                </div>

                <button class="submit-btn" onclick="submitWithdraw()">উইথড্র করুন</button>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item active"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>

        <!-- Full Screen History Page -->
        <div id="historyScreen" class="history-screen">
            <div class="header">
                <div class="header-title">
                    <a href="#" class="back-btn" onclick="closeHistoryScreen(event)"><i class="fas fa-arrow-left"></i></a>
                    Withdraw হিস্ট্রি
                </div>
            </div>
            <div class="content" id="historyList">
                <!-- হিস্ট্রি এখানে লোড হবে -->
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        window.currentUser = null;
        window.EmailAuthProvider = EmailAuthProvider;
        window.reauthenticateWithCredential = reauthenticateWithCredential;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                window.currentUser = user;
            }
        });
    </script>

    <script>
        let selectedPaymentMethod = "bKash";

        function selectMethod(element, methodName) {
            document.querySelectorAll('.method-box').forEach(box => {
                box.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedPaymentMethod = methodName;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("toastBox");
            toast.innerText = message;
            if(isError) {
                toast.classList.add("toast-error");
            } else {
                toast.classList.remove("toast-error");
            }
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        function openHistoryScreen(event) {
            event.preventDefault();
            document.getElementById('historyScreen').classList.add('active');
            loadHistory();
        }
        
        function closeHistoryScreen(event) {
            event.preventDefault();
            document.getElementById('historyScreen').classList.remove('active');
        }

        async function submitWithdraw() {
            const number = document.getElementById('accNumber').value.trim();
            const amount = document.getElementById('withdrawAmount').value.trim();
            const password = document.getElementById('withdrawPassword').value;
            const btn = document.querySelector('.submit-btn');

            if(!number || !amount || !password) {
                showToast("দয়া করে সবগুলো ফিল্ড পূরণ করুন!", true);
                return;
            }

            if(amount < 100) {
                showToast("ন্যূনতম উইথড্র পরিমাণ ১০০ টাকা!", true);
                return;
            }

            if (!window.currentUser) {
                showToast("দয়া করে একটু অপেক্ষা করুন বা আবার লগইন করুন।", true);
                return;
            }

            btn.disabled = true;
            btn.innerText = "যাচাই করা হচ্ছে...";

            try {
                const credential = window.EmailAuthProvider.credential(window.currentUser.email, password);
                await window.reauthenticateWithCredential(window.currentUser, credential);
                
                let history = JSON.parse(localStorage.getItem('withdrawHistory')) || [];
                
                const newEntry = {
                    details: `${selectedPaymentMethod}: ${number} (৳${amount})`,
                    date: new Date().toLocaleDateString('bn-BD'),
                    status: 'pending' 
                };
                
                history.unshift(newEntry); 
                localStorage.setItem('withdrawHistory', JSON.stringify(history));

                showToast("উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
                
                document.getElementById('accNumber').value = '';
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawPassword').value = '';
                
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showToast("আপনার পাসওয়ার্ডটি ভুল হয়েছে! আবার চেষ্টা করুন।", true);
                } else {
                    showToast("উইথড্র রিকোয়েস্ট ব্যর্থ হয়েছে! আবার চেষ্টা করুন।", true);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "উইথড্র করুন";
            }
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('withdrawHistory')) || [];

            historyList.innerHTML = ''; 

            if(history.length === 0) {
                historyList.innerHTML = '<p style="text-align:center; color:#888; font-size:14px; font-weight: bold; padding: 40px 10px;">কোনো হিস্ট্রি পাওয়া যায়নি।</p>';
                return;
            }

            history.forEach(item => {
                let statusClass, statusText;
                
                if(item.status === 'pending') {
                    statusClass = 'status-pending'; statusText = 'Pending';
                } else if(item.status === 'approved') {
                    statusClass = 'status-approved'; statusText = 'Approved';
                } else {
                    statusClass = 'status-rejected'; statusText = 'Rejected';
                }

                historyList.innerHTML += `
                    <div class="history-card">
                        <div class="history-left-wrap">
                            <div class="history-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                            <div class="history-info">
                                <p>${item.details}</p>
                                <small><i class="far fa-calendar-alt"></i> ${item.date}</small>
                            </div>
                        </div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
