<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
            --dark-blue: #2c3e50;
            --border-color: #dcdde1;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            min-height: 100vh; 
            background-color: var(--bg-light); 
            color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        .header { 
            background-color: var(--main-pink); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            color: var(--main-white); 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); 
            z-index: 10; 
        }

        .header-title { 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            margin-right: 15px; 
            font-size: 22px; 
        }

        .content { 
            flex-grow: 1; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }

        .login-card { 
            background-color: var(--main-white); 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            padding: 25px 20px; 
            border: 1px solid #eaeaea;
            text-align: center; 
        }

        .logo-area { 
            color: var(--main-pink); 
            font-size: 35px; 
            margin-bottom: 10px; 
        }

        h2 { 
            margin: 0 0 20px 0; 
            color: #2c3e50; 
            font-size: 20px;
        }

        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }

        .input-group input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #dcdde1; 
            border-radius: 8px; 
            font-size: 15px; 
            box-sizing: border-box; 
            outline: none; 
            transition: border-color 0.2s; 
        }

        .input-group input:focus { 
            border-color: var(--main-pink); 
            box-shadow: 0 0 0 3px rgba(226, 0, 90, 0.1);
        }

        .forgot-pass {
            text-align: right;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .forgot-pass a {
            color: var(--text-grey);
            text-decoration: none;
            transition: 0.2s;
        }
        .forgot-pass a:hover {
            color: var(--main-pink);
        }

        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--main-pink); 
            color: var(--main-white); 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px; 
            transition: background 0.3s; 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.25);
        }

        .login-btn:hover { 
            background-color: #c4004e; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(226, 0, 90, 0.35);
        }

        .divider { 
            display: flex; 
            align-items: center; 
            text-align: center; 
            color: var(--text-grey); 
            margin-bottom: 15px; 
            font-size: 13px;
        }
        .divider::before, .divider::after { 
            content: ''; 
            flex: 1; 
            border-bottom: 1px solid #eaeaea; 
        }
        .divider span { 
            padding: 0 10px; 
        }

        /* নতুন ফেস লগইন বাটন ডিজাইন (আউটলাইন স্টাইল) */
        .social-btn.face-login { 
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid var(--main-pink); 
            border-radius: 8px; 
            background-color: white; 
            font-size: 15px; 
            font-weight: bold; 
            color: var(--main-pink); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 15px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(226, 0, 90, 0.1);
        }
        .social-btn.face-login i {
            font-size: 18px;
        }
        .social-btn.face-login:hover { 
            background-color: var(--main-pink); 
            color: white;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.3);
            transform: translateY(-2px);
        }

        .switch-page { 
            margin-top: 10px; 
            font-size: 14px; 
            color: var(--text-grey); 
        }

        .switch-page a { 
            color: var(--main-pink); 
            font-weight: bold; 
            text-decoration: none; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header with Back Button -->
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Login
            </div>
        </div>

        <!-- Content Area inside Phone Container -->
        <div class="content">
            <div class="login-card">
                <div class="logo-area">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <h2>Send bKash এ স্বাগতম</h2>

                <div class="input-group">
                    <input type="text" id="emailOrPhone" placeholder="ইমেইল অ্যাড্রেস অথবা ফোন নাম্বার" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
                </div>

                <div class="forgot-pass">
                    <a href="#" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button class="login-btn" id="emailLoginBtn">লগইন করুন</button>

                <div class="divider">
                    <span>অথবা</span>
                </div>

                <!-- নতুন ডিজাইনের Face দিয়ে লগইন বাটন -->
                <button class="social-btn face-login" id="faceLoginBtn">
                    <i class="fas fa-user-check"></i> Face দিয়ে লগইন করুন
                </button>

                <div class="switch-page">
                    অ্যাকাউন্ট নেই? <a href="register.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Login/Forgot Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66",
            measurementId: "G-ZSRNS5RPV5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("emailLoginBtn").addEventListener("click", () => {
            let inputVal = document.getElementById("emailOrPhone").value.trim();
            const password = document.getElementById("password").value;
            
            if(inputVal && password) {
                let finalEmail = inputVal;
                let isPhone = /^\d+$/.test(inputVal);
                if(isPhone) {
                    finalEmail = inputVal + "@sendbkash.com";
                }

                signInWithEmailAndPassword(auth, finalEmail, password)
                .then(() => {
                    alert("লগইন সফল হয়েছে!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ! ইমেইল/ফোন নাম্বার বা পাসওয়ার্ড ভুল হতে পারে।");
                    console.error(error);
                });
            } else {
                alert("দয়া করে ইমেইল/ফোন নাম্বার এবং পাসওয়ার্ড লিখুন!");
            }
        });

        // Face দিয়ে লগইন করার হ্যান্ডলার
        document.getElementById("faceLoginBtn").addEventListener("click", async () => {
            if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
                try {
                    const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    if (available) {
                        alert("ফেস স্ক্যান / বায়োমেট্রিক স্ক্যান সফল হয়েছে!");
                        window.location.href = "index.html";
                    } else {
                        alert("এই ডিভাইসে ফেস আইডি বা বায়োমেট্রিক সাপোর্ট করছে না!");
                    }
                } catch (err) {
                    alert("ফেস লগইন এ একটি সমস্যা হয়েছে।");
                    console.error(err);
                }
            } else {
                alert("আপনার ব্রাউজার বা ডিভাইসে ফেস লগইন ফিচারটি সমর্থিত নয়।");
            }
        });

        document.getElementById("forgotBtn").addEventListener("click", (e) => {
            e.preventDefault();
            let inputVal = document.getElementById("emailOrPhone").value.trim();
            
            if(!inputVal) {
                alert("প্রথমে ওপরের বক্সে আপনার রেজিস্টার্ড ইমেইল অথবা ফোন নাম্বারটি লিখুন!");
                return;
            }

            let finalEmail = inputVal;
            let isPhone = /^\d+$/.test(inputVal);
            if(isPhone) {
                finalEmail = inputVal + "@sendbkash.com";
            }

            sendPasswordResetEmail(auth, finalEmail)
            .then(() => {
                alert("পাসওয়ার্ড রিসেট করার লিংক আপনার ইমেইলে পাঠানো হয়েছে। ইনবক্স চেক করুন!");
            })
            .catch((error) => {
                alert("রিসেট লিংক পাঠানো যায়নি: " + error.message);
                console.error(error);
            });
        });
    </script>
</body>
</html>
