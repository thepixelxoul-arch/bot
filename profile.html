<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; min-height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
        }
        .header-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 22px; }
        .header-action { color: white; font-size: 18px; text-decoration: none; }

        .content { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 80px; }
        
        .profile-card {
            background-color: var(--main-white); border-radius: 12px; padding: 25px 20px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;
            margin-bottom: 15px;
        }
        
        .profile-avatar {
            width: 75px; height: 75px; background-color: rgba(226, 0, 90, 0.05);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px auto; color: var(--main-pink); font-size: 14px; font-weight: bold;
            border: 2px solid var(--main-pink); text-align: center; padding: 5px; line-height: 1.2;
            box-sizing: border-box;
        }

        .profile-email { font-size: 17px; font-weight: bold; color: #2c3e50; margin: 0 0 10px 0; word-break: break-all; }
        
        /* ব্যাজ কন্টেইনার */
        .badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .user-id-badge {
            background-color: #f1f2f6; padding: 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: bold; color: #2c3e50;
            border: 1px solid #dcdde1;
        }

        /* VIP স্ট্যাটাস ব্যাজ */
        .vip-badge {
            background: linear-gradient(135deg, #718093, #2f3640);
            color: white; padding: 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .vip-badge i { font-size: 10px; color: #f39c12; }

        .stats-card {
            background-color: var(--main-white); border-radius: 12px; padding: 15px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px;
        }
        .stat-item { flex: 1; border-right: 1px solid #eaeaea; }
        .stat-item:last-child { border-right: none; }
        .stat-num { font-size: 18px; font-weight: bold; color: var(--main-pink); margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: var(--text-grey); font-weight: bold; }

        .menu-list {
            background-color: var(--main-white); border-radius: 12px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden; margin-bottom: 20px;
        }
        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; text-decoration: none; color: #2c3e50;
            border-bottom: 1px solid #f1f2f6; transition: background 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        
        .menu-item:hover { background-color: rgba(226, 0, 90, 0.08); }
        
        .menu-left { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: bold; }
        .menu-left i { font-size: 16px; color: var(--main-pink); width: 20px; text-align: center; }
        .menu-item.admin-menu { background-color: rgba(226, 0, 90, 0.05); color: var(--main-pink); }
        .menu-item.admin-menu:hover { background-color: rgba(226, 0, 90, 0.12); }

        .logout-btn {
            background: linear-gradient(135deg, #fff3cd, #ffeeba); color: #856404;
            border: 1px solid #ffeeba; border-radius: 10px; padding: 14px;
            font-size: 15px; font-weight: bold; width: 100%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: background 0.2s;
        }
        .logout-btn:hover { background: linear-gradient(135deg, #ffeeba, #ffe8a1); }

        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: sticky; bottom: 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Profile
            </div>
            <a href="#" class="header-action"><i class="fas fa-bell"></i></a>
        </div>

        <div class="content">
            <div class="profile-card">
                <div class="profile-avatar">
                    Send bKash
                </div>
                <div class="profile-email" id="userEmail">Loading...</div>
                
                <div class="badge-container">
                    <div class="user-id-badge">User ID: <span id="userIdDisplay">Loading...</span></div>
                    <div class="vip-badge"><i class="fas fa-crown"></i> <span id="vipLevelText">VIP 0</span></div>
                </div>
            </div>

            <div class="stats-card">
                <div class="stat-item">
                    <div class="stat-num">৳৩৫০.০০</div>
                    <div class="stat-label">মোট আয়</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">৳৩০০.০০</div>
                    <div class="stat-label">মোট উইথড্র</div>
                </div>
            </div>

            <div class="menu-list">
                <a href="admin.html" class="menu-item admin-menu">
                    <div class="menu-left"><i class="fas fa-user-shield"></i> এডমিন প্যানেল</div>
                    <i class="fas fa-chevron-right" style="font-size: 12px; color: var(--main-pink);"></i>
                </a>
                <a href="change-password.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-lock"></i> পাসওয়ার্ড পরিবর্তন</div>
                    <i class="fas fa-chevron-right" style="font-size: 12px; color: var(--text-grey);"></i>
                </a>
                <a href="support.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-headset"></i> হেল্পলাইন ও সাপোর্ট</div>
                    <i class="fas fa-chevron-right" style="font-size: 12px; color: var(--text-grey);"></i>
                </a>
                <a href="rules.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-file-alt"></i> কাজের নিয়মাবলী</div>
                    <i class="fas fa-chevron-right" style="font-size: 12px; color: var(--text-grey);"></i>
                </a>
            </div>

            <button class="logout-btn" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i> লগআউট করুন
            </button>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ১. ইউজারের জিমেইল সেট করা
                document.getElementById("userEmail").innerText = user.email || "sakibbinsalam.admin@gmail.com";
                
                // ২. ইউজারের UID অনুযায়ী ডাইনামিক User ID তৈরি করা (প্রথম ১০ অক্ষর)
                const shortUid = user.uid.substring(0, 10).toUpperCase();
                document.getElementById("userIdDisplay").innerText = shortUid;

                // ৩. ডাইনামিক VIP স্ট্যাটাস সেট করা (লোকালস্টোরেজ থেকে)
                // যদি ইউজারের VIP কেনা থাকে তবে সেটি স্টোরেজ থেকে পাবে, না থাকলে ডিফল্ট "VIP 0" দেখাবে
                const userVip = localStorage.getItem('userVipLevel') || "VIP 0";
                document.getElementById("vipLevelText").innerText = userVip;

            } else {
                window.location.href = "login.html";
            }
        });

        window.logoutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.log(error);
            });
        }
    </script>
</body>
</html>
