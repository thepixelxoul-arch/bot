<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; min-height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            position: sticky; top: 0;
        }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        .header-balance {
            background-color: rgba(255, 255, 255, 0.2); padding: 6px 12px;
            border-radius: 6px; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; gap: 6px;
        }

        .content { flex-grow: 1; padding: 15px; overflow-y: auto; padding-bottom: 80px; }
        
        .section-title {
            font-size: 15px; font-weight: bold; color: #2c3e50; 
            margin: 10px 0 15px 0;
        }

        /* টাস্ক কার্ড স্টাইল */
        .task-card {
            background: var(--main-white); border-radius: 10px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea; text-decoration: none; color: inherit;
        }
        
        .task-left { display: flex; align-items: center; gap: 15px; }
        
        .task-icon {
            width: 45px; height: 45px; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 22px;
        }
        .vip-icon { color: #f39c12; font-size: 24px; width: 45px; text-align: center; }
        .bg-gmail { background-color: #e74c3c; }
        .bg-whatsapp { background-color: #2ecc71; }
        .bg-telegram { background-color: #3498db; }
        .bg-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

        .task-info h4 { margin: 0 0 5px 0; font-size: 15px; color: #2c3e50; }
        .task-info p { margin: 0; font-size: 12px; font-weight: bold; color: var(--main-pink); }
        
        .task-btn {
            background-color: #fce4ec; color: var(--main-pink);
            border: none; padding: 8px 12px; border-radius: 6px;
            font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .task-btn:hover { background-color: var(--main-pink); color: white; }

        /* বটম নেভিগেশন */
        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: sticky; bottom: 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- হেডার -->
        <div class="header">
            <div class="header-title">
                <i class="fas fa-paper-plane"></i> Send bKash
            </div>
            <div class="header-balance">
                <i class="fas fa-wallet"></i> ৳৫০.০০
            </div>
        </div>

        <div class="content">
            <!-- মেসেজটি মুছে দেওয়া হয়েছে -->

            <div class="section-title">কাজ নির্বাচন করুন</div>

            <!-- VIP Upgrade -->
            <a href="vip.html" class="task-card">
                <div class="task-left">
                    <i class="fas fa-crown vip-icon"></i>
                    <div class="task-info">
                        <h4>VIP আপগ্রেড</h4>
                    </div>
                </div>
                <button class="task-btn">চেক করুন</button>
            </a>

            <!-- Gmail Account -->
            <a href="#" class="task-card">
                <div class="task-left">
                    <div class="task-icon bg-gmail"><i class="fab fa-google"></i></div>
                    <div class="task-info">
                        <h4>Gmail Account</h4>
                        <p>জিমেইল তৈরি করুন (রেট: ৳৭.৫০)</p>
                    </div>
                </div>
                <button class="task-btn">তৈরি করুন</button>
            </a>

            <!-- WhatsApp Account -->
            <a href="#" class="task-card">
                <div class="task-left">
                    <div class="task-icon bg-whatsapp"><i class="fab fa-whatsapp"></i></div>
                    <div class="task-info">
                        <h4>WhatsApp Account</h4>
                        <p>রেট: ৳১৫.০০</p>
                    </div>
                </div>
                <button class="task-btn">জমা দিন</button>
            </a>

            <!-- Telegram Account -->
            <a href="#" class="task-card">
                <div class="task-left">
                    <div class="task-icon bg-telegram"><i class="fab fa-telegram-plane"></i></div>
                    <div class="task-info">
                        <h4>Telegram Account</h4>
                        <p>রেট: ৳১২.০০</p>
                    </div>
                </div>
                <button class="task-btn">জমা দিন</button>
            </a>

            <!-- Instagram Account -->
            <a href="#" class="task-card">
                <div class="task-left">
                    <div class="task-icon bg-instagram"><i class="fab fa-instagram"></i></div>
                    <div class="task-info">
                        <h4>Instagram Account</h4>
                        <p>রেট: ৳১০.০০</p>
                    </div>
                </div>
                <button class="task-btn">জমা দিন</button>
            </a>

        </div>

        <!-- বটম মেনু -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
