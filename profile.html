<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            min-height: 100vh; 
            background-color: var(--bg-light); 
            color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        .header { 
            background-color: var(--main-pink); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--main-white); 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); 
            z-index: 10; 
        }

        .header-title { 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            margin-right: 15px; 
            font-size: 22px; 
        }

        .content { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
        }

        .profile-card { 
            background-color: var(--main-white); 
            border-radius: 15px; 
            padding: 30px 20px; 
            text-align: center; 
            border: 1px solid #eaeaea; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px; 
        }

        .avatar { 
            width: 80px; 
            height: 80px; 
            background-color: rgba(226, 0, 90, 0.1); 
            color: var(--main-pink); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 35px; 
            margin: 0 auto 15px auto; 
            border: 2px solid var(--main-pink); 
        }

        .profile-card h2 { 
            margin: 0 0 5px 0; 
            color: #2c3e50; 
            font-size: 22px; 
        }

        .profile-card p { 
            margin: 0; 
            color: var(--text-grey); 
            font-size: 14px; 
        }

        .profile-card .uid { 
            background-color: #f1f2f6; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: bold; 
            color: #2f3640; 
            display: inline-block; 
            margin-top: 8px; 
            font-size: 13px; 
        }

        .profile-stats { 
            display: flex; 
            background-color: var(--main-white); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid #eaeaea; 
        }

        .stat-item { 
            text-align: center; 
            flex: 1; 
        }

        .stat-item:first-child { 
            border-right: 1px solid #eaeaea; 
        }

        .stat-item h3 { 
            margin: 0 0 5px 0; 
            color: var(--main-pink); 
            font-size: 20px; 
        }

        .stat-item p { 
            margin: 0; 
            color: var(--text-grey); 
            font-size: 13px; 
        }

        .menu-list { 
            background-color: var(--main-white); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #eaeaea; 
            margin-bottom: 20px; 
        }

        .menu-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 20px; 
            border-bottom: 1px solid #eaeaea; 
            color: #2c3e50; 
            text-decoration: none; 
            font-weight: 500; 
        }

        .menu-item:hover { 
            background-color: #f8f9fa; 
        }

        .menu-left { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .menu-left i { 
            color: var(--main-pink); 
            width: 20px; 
            text-align: center; 
        }

        /* অ্যাডমিন বাটনের আলাদা স্টাইল */
        .menu-item.admin-btn {
            background-color: #e2005a;
            color: white;
            font-weight: bold;
            display: none; /* ডিফল্টভাবে লুকিয়ে থাকবে */
        }
        .menu-item.admin-btn:hover {
            background-color: #c4004e;
        }
        .menu-item.admin-btn .menu-left i {
            color: white;
        }

        .logout-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 15px; 
            background-color: #ffeaa7; 
            color: #d63031; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 10px; 
        }

        .bottom-nav { 
            background-color: var(--main-white); 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0 15px 0; 
            border-top: 1px solid #eaeaea; 
            z-index: 10; 
        }

        .nav-item { 
            text-align: center; 
            font-size: 12px; 
            color: var(--text-grey); 
            cursor: pointer; 
            flex: 1; 
            text-decoration: none; 
        }

        .nav-item i { 
            font-size: 20px; 
            margin-bottom: 6px; 
            display: block; 
        }

        .nav-item.active { 
            color: var(--main-pink); 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Profile
            </div>
            <div><i class="fas fa-bell"></i></div>
        </div>

        <div class="content">
            <div class="profile-card">
                <div class="avatar"><i class="fas fa-user-tie"></i></div>
                <h2 id="userName">প্রিয় গ্রাহক</h2>
                <p id="userEmail">Loading...</p>
                <div class="uid" id="userId">User ID: --</div>
            </div>

            <div class="profile-stats">
                <div class="stat-item"><h3>৳৩৫০.০০</h3><p>মোট আয়</p></div>
                <div class="stat-item"><h3>৳৩০০.০০</h3><p>মোট উইথড্র</p></div>
            </div>

            <div class="menu-list">
                <!-- অ্যাডমিন প্যানেল বাটন (শুধুমাত্র অ্যাডমিনের জন্য দৃশ্যমান হবে) -->
                <a href="admin.html" class="menu-item admin-btn" id="adminPanelBtn">
                    <div class="menu-left">
                        <i class="fas fa-user-shield"></i> অ্যাডমিন প্যানেল
                    </div>
                    <i class="fas fa-chevron-right" style="color: white; font-size: 12px;"></i>
                </a>

                <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-lock"></i> পাসওয়ার্ড পরিবর্তন</div><i class="fas fa-chevron-right" style="color:#b2bec3; font-size:12px;"></i></a>
                <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-headset"></i> হেল্পলাইন ও সাপোর্ট</div><i class="fas fa-chevron-right" style="color:#b2bec3; font-size:12px;"></i></a>
                <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-file-contract"></i> কাজের নিয়মাবলী</div><i class="fas fa-chevron-right" style="color:#b2bec3; font-size:12px;"></i></a>
            </div>

            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> লগআউট করুন</button>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Admin Control -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66",
            measurementId: "G-ZSRNS5RPV5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ইউজারের ইমেইল ও আইডি দেখানো
                document.getElementById("userEmail").innerText = user.email;
                document.getElementById("userId").innerText = "User ID: " + user.uid.slice(0, 10);

                // চেক করা ইউজারটি অ্যাডমিন কি না
                if (user.email === "sakibbinsalam.admin@gmail.com") {
                    document.getElementById("adminPanelBtn").style.display = "flex"; // শুধুমাত্র অ্যাডমিনের জন্য দেখাবে
                }
            } else {
                window.location.href = "login.html"; // লগইন করা না থাকলে প্রোফাইলে ঢুকতে দিবে না
            }
        });

        // লগআউট ফাংশন
        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
