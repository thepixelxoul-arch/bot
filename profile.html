<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
            overflow: hidden; 
        }

        .header { 
            flex-shrink: 0; 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
        }
        .header-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 22px; }
        .header-action { color: white; font-size: 20px; text-decoration: none; transition: 0.2s; }
        .header-action:hover { color: #f1f2f6; transform: scale(1.1); }

        .content { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 30px; }

        .vip-huge-card {
            background: linear-gradient(135deg, var(--main-pink), #ff3377);
            border-radius: 12px;
            padding: 35px 20px;
            margin-bottom: 25px; 
            color: white;
            text-align: center;
            box-shadow: 0 8px 20px rgba(226, 0, 90, 0.3);
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* আপগ্রেড বাটন সম্পূর্ণ বড় হাতের করা হয়েছে */
        .vip-upgrade-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #ffcc00;
            color: #333;
            font-size: 11px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            text-transform: uppercase; /* বড় হাতের অক্ষর */
        }
        .vip-upgrade-btn:hover {
            transform: scale(1.05);
        }

        .vip-icon-circle {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .vip-huge-card h3 {
            font-size: 20px; 
            font-weight: 900;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        .vip-huge-card p {
            font-size: 14px; 
            color: #ffe6f0;
            margin: 0;
            font-weight: 600;
            line-height: 1.6;
            padding: 0 10px;
        }

        .stats-card {
            background-color: var(--main-white); border-radius: 12px; padding: 20px 15px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px;
        }
        .stat-item { flex: 1; border-right: 1px solid #eaeaea; }
        .stat-item:last-child { border-right: none; }
        .stat-num { font-size: 20px; font-weight: bold; color: var(--main-pink); margin-bottom: 5px; }
        .stat-label { font-size: 13px; color: var(--text-grey); font-weight: bold; }

        .menu-list {
            background-color: var(--main-white); border-radius: 12px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden; margin-bottom: 25px;
        }
        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px; text-decoration: none; color: #2c3e50;
            border-bottom: 1px solid #f1f2f6; transition: background 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background-color: rgba(226, 0, 90, 0.08); }
        
        .menu-left { display: flex; align-items: center; gap: 15px; font-size: 15px; font-weight: bold; }
        .menu-left i { font-size: 18px; color: var(--main-pink); width: 20px; text-align: center; }

        .logout-btn {
            background: linear-gradient(135deg, #fff3cd, #ffeeba); color: #856404;
            border: 1px solid #ffeeba; border-radius: 10px; padding: 16px;
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: background 0.2s;
        }
        .logout-btn:hover { background: linear-gradient(135deg, #ffeeba, #ffe8a1); }

        .bottom-nav { 
            flex-shrink: 0; 
            background-color: var(--main-white); display: flex; justify-content: space-around; 
            padding: 10px 0; border-top: 1px solid #eaeaea; z-index: 100; 
        }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Profile
            </div>
            <a href="admin.html" class="header-action" title="এডমিন প্যানেল"><i class="fas fa-user-shield"></i></a>
        </div>

        <div class="content">
            <div class="vip-huge-card">
                <a href="vip.html" class="vip-upgrade-btn">UPGRADE</a>

                <div class="vip-icon-circle"><i class="fas fa-crown" id="vipIcon"></i></div>
                <h3 id="vipLevelText">VIP 0</h3>
                <p id="vipDescText">Loading...</p>
            </div>

            <div class="stats-card">
                <div class="stat-item">
                    <div class="stat-num">৳৩৫০.০০</div>
                    <div class="stat-label">মোট আয়</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">৳৩০০.০০</div>
                    <div class="stat-label">মোট উইথড্র</div>
                </div>
            </div>

            <div class="menu-list">
                <a href="security.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-user-lock"></i> প্রোফাইল সুরক্ষা</div>
                    <i class="fas fa-chevron-right" style="font-size: 13px; color: var(--text-grey);"></i>
                </a>
                <a href="support.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-headset"></i> হেল্পলাইন ও সাপোর্ট</div>
                    <i class="fas fa-chevron-right" style="font-size: 13px; color: var(--text-grey);"></i>
                </a>
                <a href="rules.html" class="menu-item">
                    <div class="menu-left"><i class="fas fa-file-alt"></i> কাজের নিয়মাবলী</div>
                    <i class="fas fa-chevron-right" style="font-size: 13px; color: var(--text-grey);"></i>
                </a>
            </div>

            <button class="logout-btn" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i> লগআউট করুন
            </button>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // কাজের লিমিট
        const vipInfoMap = {
            "VIP 0": "দৈনিক ১০টি জিমেইল ও ৫টি ইনস্টাগ্রাম কাজ।",
            "VIP 1": "দৈনিক ২০টি জিমেইল ও ১০টি ইনস্টাগ্রাম কাজ।",
            "VIP 2": "দৈনিক ৩০টি জিমেইল ও ২০টি ইনস্টাগ্রাম কাজ।",
            "VIP 3": "দৈনিক ৪০টি জিমেইল ও ৩০টি ইনস্টাগ্রাম কাজ।",
            "VIP 4": "দৈনিক ৫০টি জিমেইল ও ৪০টি ইনস্টাগ্রাম কাজ।",
            "VIP 5": "দৈনিক ৬০টি জিমেইল ও ৫০টি ইনস্টাগ্রাম কাজ।",
            "VIP 6": "দৈনিক ৭০টি জিমেইল ও ৬০টি ইনস্টাগ্রাম কাজ।",
            "VIP 7": "দৈনিক ৮০টি জিমেইল ও ৭০টি ইনস্টাগ্রাম কাজ।",
            "VIP 8": "দৈনিক ৯০টি জিমেইল ও ৮০টি ইনস্টাগ্রাম কাজ।",
            "VIP 9": "দৈনিক ১০০টি জিমেইল ও ৯০টি ইনস্টাগ্রাম কাজ।",
            "VIP 10": "দৈনিক ১১০টি জিমেইল ও ১০০টি ইনস্টাগ্রাম কাজ।",
            "Send bKash Member": "দৈনিক ২০০টি জিমেইল ও ১৮০টি ইনস্টাগ্রাম কাজ।"
        };

        // সাপ্তাহিক বোনাস 
        const vipBonusMap = {
            "VIP 0": "০",
            "VIP 1": "১০",
            "VIP 2": "২০",
            "VIP 3": "৩০",
            "VIP 4": "৪০",
            "VIP 5": "৫০",
            "VIP 6": "৬০",
            "VIP 7": "৭০",
            "VIP 8": "৮০",
            "VIP 9": "৯০",
            "VIP 10": "১০০",
            "Send bKash Member": "২০০"
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userVip = localStorage.getItem('userVipLevel') || "VIP 0";
                
                document.getElementById("vipLevelText").innerText = userVip;

                const descElem = document.getElementById("vipDescText");
                const iconElem = document.getElementById("vipIcon");
                
                if (userVip === "VIP 0") {
                    iconElem.className = "fas fa-crown";
                } else if (userVip === "Send bKash Member") {
                    iconElem.className = "fas fa-star";
                } else {
                    iconElem.className = "fas fa-crown";
                }

                const taskDesc = vipInfoMap[userVip] || "স্পেশাল VIP অফার একটিভ আছে।";
                const bonusAmount = vipBonusMap[userVip] || "০";
                
                // কাজের লিমিটের আগে সাপ্তাহিক বোনাস অ্যাড করা হয়েছে
                descElem.innerHTML = `সাপ্তাহিক বোনাস: ৳${bonusAmount} <br> ${taskDesc}`;

            } else {
                window.location.href = "login.html";
            }
        });

        window.logoutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.log(error);
            });
        }
    </script>
</body>
</html>
