<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
            --border-color: #dcdde1;
            --dark-blue: #2c3e50;
            --warning-yellow: #f39c12;
        }

        /* বডি এবং মেইন ফ্রেম ফিক্সড করার কোড */
        body, html { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .app-container { 
            width: 100%; max-width: 450px; height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
            overflow: hidden; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 15px;}
        .back-btn { color: white; text-decoration: none; font-size: 20px; transition: 0.2s; }
        .back-btn:hover { transform: translateX(-3px); }
        .history-btn { color: white; font-size: 18px; text-decoration: none; }

        /* স্ক্রলেবল কনটেন্ট এরিয়া */
        .content { 
            flex-grow: 1; padding: 15px; 
            overflow-y: auto; 
            padding-bottom: 80px; 
            -webkit-overflow-scrolling: touch; 
        }
        
        /* হলুদ ওয়ার্নিং নোট */
        .warning-note {
            background: linear-gradient(135deg, #fffbf0, #fff4ce); 
            border: 1px solid #fae5b6; 
            border-left: 4px solid var(--warning-yellow);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #b9770e;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            font-weight: bold;
        }
        .warning-note i { margin-right: 5px; color: var(--warning-yellow); }

        /* পিংক ব্যালেন্স কার্ড */
        .balance-card {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink));
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.25);
        }
        .balance-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .balance-amount { font-size: 24px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        /* সাদা উইথড্র কার্ড */
        .payment-card {
            background-color: var(--main-white); border-radius: 12px; padding: 20px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .section-title { font-size: 14px; font-weight: 900; color: var(--dark-blue); margin-bottom: 15px; }

        .method-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .method-box {
            border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 5px;
            text-align: center; cursor: pointer; transition: 0.2s; background-color: var(--main-white);
        }
        .method-box i { font-size: 22px; margin-bottom: 5px; display: block; }
        .method-box span { font-size: 11px; font-weight: bold; color: var(--dark-blue); }
        
        .method-box.active {
            border: 2px solid var(--main-pink); background-color: #fff5f8;
        }
        .method-box.active span { color: var(--main-pink); }

        .c-bkash { color: #e2136e; }
        .c-nagad { color: #f39c12; }
        .c-rocket { color: #8e44ad; }
        .c-upay { color: #2980b9; }

        .input-group { margin-bottom: 18px; position: relative; }
        .input-label { display: block; font-size: 13px; font-weight: bold; color: var(--dark-blue); margin-bottom: 8px; }
        .input-box {
            width: 100%; padding: 12px 15px 12px 40px; border: 1.5px solid var(--border-color); border-radius: 8px;
            font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s;
            color: var(--dark-blue); background-color: #fcfcfc;
        }
        .input-box:focus { border-color: var(--main-pink); background-color: white; box-shadow: 0 0 0 3px rgba(226, 0, 90, 0.1); }
        
        .input-icon {
            position: absolute; left: 15px; top: 35px; color: #a4b0be; font-size: 14px; transition: 0.3s;
        }
        .input-box:focus + .input-icon, .input-box:not(:placeholder-shown) + .input-icon { color: var(--main-pink); }

        /* স্পেশাল সিকিউরিটি পাসওয়ার্ড ফিল্ড */
        .security-input-group {
            background-color: #fff5f8;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #ffd6e4;
            margin-bottom: 20px;
        }
        .security-input-group .input-box { background-color: white; }

        .submit-btn {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink)); color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold;
            width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(226, 0, 90, 0.25);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(226, 0, 90, 0.35); }
        .submit-btn:disabled { background: #dcdde1; cursor: not-allowed; box-shadow: none; transform: none; }

        /* বটম মেন্যু */
        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: absolute; bottom: 0; width: 100%; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }

        /* টোস্ট ও মডেল */
        .toast-msg {
            visibility: hidden; min-width: 250px; background-color: var(--main-pink);
            color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
            position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%);
            top: 20px; font-size: 13px; font-weight: bold; line-height: 1.4;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.4); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; top: 40px; }
        .toast-error { background-color: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; visibility: hidden; opacity: 0; transition: 0.3s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        
        .modal-content {
            background-color: var(--main-white); width: 85%; max-width: 320px;
            padding: 30px 20px; border-radius: 15px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        
        .modal-icon { font-size: 55px; color: #27ae60; margin-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: 900; color: var(--dark-blue); margin-bottom: 10px; }
        .modal-text { font-size: 14px; color: var(--text-grey); line-height: 1.5; margin-bottom: 20px; font-weight: bold; }
        
        .modal-btn {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink)); color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold;
            width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(226, 0, 90, 0.2);
        }
        .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(226, 0, 90, 0.3); }

    </style>
</head>
<body>

    <div id="toastBox" class="toast-msg"></div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-check-circle modal-icon"></i>
            <div class="modal-title">উইথড্র সফল!</div>
            <div class="modal-text" id="modalMessage">আপনার উইথড্র রিকোয়েস্ট জমা হয়েছে।</div>
            <button class="modal-btn" onclick="closeModal()">ওকে</button>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="header-title" style="margin-left: 15px;">Withdraw</div>
            </div>
            <!-- হিস্ট্রি আইকন -->
            <a href="#" class="history-btn"><i class="fas fa-history"></i></a>
        </div>

        <div class="content">
            <!-- Warning -->
            <div class="warning-note">
                <i class="fas fa-info-circle"></i> ন্যূনতম উইথড্র পরিমাণ ১০০ টাকা। ২৪ ঘণ্টার মধ্যে পেমেন্ট কমপ্লিট করা হবে।
            </div>

            <!-- Balance Card -->
            <div class="balance-card">
                <div class="balance-title"><i class="fas fa-wallet"></i> আপনার মূল ব্যালেন্স:</div>
                <div class="balance-amount" id="userBalance">৳ 0.00</div>
            </div>

            <div class="payment-card">
                <div class="section-title">পেমেন্ট মেথড সিলেক্ট করুন</div>
                
                <div class="method-grid">
                    <div class="method-box active" data-method="bKash" onclick="selectMethod(this)">
                        <i class="fas fa-wallet c-bkash"></i>
                        <span>bKash</span>
                    </div>
                    <div class="method-box" data-method="Nagad" onclick="selectMethod(this)">
                        <i class="fas fa-wallet c-nagad"></i>
                        <span>Nagad</span>
                    </div>
                    <div class="method-box" data-method="Rocket" onclick="selectMethod(this)">
                        <i class="fas fa-wallet c-rocket"></i>
                        <span>Rocket</span>
                    </div>
                    <div class="method-box" data-method="Upay" onclick="selectMethod(this)">
                        <i class="fas fa-wallet c-upay"></i>
                        <span>Upay</span>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">একাউন্ট নাম্বার (Account Number)</label>
                    <input type="number" id="accountNo" class="input-box" placeholder="আপনার নাম্বার দিন">
                    <i class="fas fa-phone-alt input-icon"></i>
                </div>

                <div class="input-group">
                    <label class="input-label">টাকার পরিমাণ (Amount)</label>
                    <input type="number" id="withdrawAmount" class="input-box" placeholder="৳ পরিমাণ লিখুন">
                    <i class="fas fa-money-bill-wave input-icon"></i>
                </div>

                <!-- নতুন পাসওয়ার্ড সিকিউরিটি ফিল্ড -->
                <div class="security-input-group">
                    <label class="input-label" style="color: var(--main-pink);"><i class="fas fa-shield-alt"></i> অ্যাকাউন্ট পাসওয়ার্ড</label>
                    <div class="input-group" style="margin-bottom: 0;">
                        <input type="password" id="withdrawPassword" class="input-box" placeholder="আপনার পাসওয়ার্ড দিন">
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div style="font-size: 11px; color: var(--text-grey); margin-top: 8px; text-align: center;">টাকা উত্তোলনের জন্য আপনার বর্তমান পাসওয়ার্ডটি প্রয়োজন।</div>
                </div>

                <button class="submit-btn" id="withdrawBtn" onclick="submitWithdraw()">উইথড্র করুন</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item active"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let currentUser = null;

        // ডেমো ব্যালেন্স (ডেটাবেস থেকে আসলে এটা চেঞ্জ হবে)
        const currentBalance = 500.00; 
        document.getElementById("userBalance").innerText = `৳ ${currentBalance}`;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                currentUser = user;
            }
        });

        // পেমেন্ট মেথড সিলেক্ট করার ফাংশন
        window.selectMethod = function(element) {
            document.querySelectorAll('.method-box').forEach(box => {
                box.classList.remove('active');
            });
            element.classList.add('active');
        };

        // উইথড্র সাবমিট করার ফাংশন
        window.submitWithdraw = async function() {
            const method = document.querySelector('.method-box.active');
            const accountNo = document.getElementById("accountNo").value;
            const amount = document.getElementById("withdrawAmount").value;
            const password = document.getElementById("withdrawPassword").value;
            const btn = document.getElementById("withdrawBtn");

            if (!method || !accountNo || !amount || !password) {
                showToast("দয়া করে সবগুলো ফিল্ড পূরণ করুন!", true);
                return;
            }

            if (parseFloat(amount) < 100) {
                showToast("ন্যূনতম উইথড্র পরিমাণ ১০০ টাকা!", true);
                return;
            }

            if (parseFloat(amount) > currentBalance) {
                showToast("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", true);
                return;
            }

            if (!currentUser) return;

            btn.disabled = true;
            btn.innerText = "যাচাই করা হচ্ছে...";

            // ফায়ারবেস Re-authentication (পাসওয়ার্ড চেক করা)
            const credential = EmailAuthProvider.credential(currentUser.email, password);

            try {
                // ইউজার সঠিক পাসওয়ার্ড দিয়েছে কিনা চেক করা
                await reauthenticateWithCredential(currentUser, credential);
                
                // পাসওয়ার্ড ঠিক থাকলে রিকোয়েস্ট সাবমিট হবে
                const methodName = method.getAttribute("data-method");
                document.getElementById("modalMessage").innerText = `আপনার ৳${amount} উইথড্র রিকোয়েস্ট (${methodName}) সফলভাবে জমা হয়েছে। ২৪ ঘণ্টার মধ্যে পেমেন্ট কমপ্লিট করা হবে।`;
                document.getElementById("successModal").classList.add("show");
                
                // ইনপুট ফিল্ড ক্লিয়ার করা
                document.getElementById("accountNo").value = "";
                document.getElementById("withdrawAmount").value = "";
                document.getElementById("withdrawPassword").value = "";
                
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showToast("আপনার পাসওয়ার্ডটি ভুল হয়েছে! আবার চেষ্টা করুন।", true);
                } else {
                    showToast("উইথড্র রিকোয়েস্ট ব্যর্থ হয়েছে! আবার চেষ্টা করুন।", true);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "উইথড্র করুন";
            }
        };

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById("toastBox");
            toast.innerText = message;
            
            if(isError) {
                toast.classList.add("toast-error");
            } else {
                toast.classList.remove("toast-error");
            }

            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        window.closeModal = function() {
            document.getElementById("successModal").classList.remove("show");
        }
    </script>
</body>
</html>
