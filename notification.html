<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
            --dark-blue: #2c3e50;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
        }

        .app-container { 
            width: 100%; max-width: 450px; min-height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            position: sticky; top: 0;
        }
        .header-left { display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 20px; transition: 0.2s; }
        .back-btn:hover { transform: translateX(-3px); }

        .content { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 80px; }
        
        /* নোটিফিকেশন কার্ড স্টাইল */
        .notif-card {
            background-color: var(--main-white);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border-left: 4px solid var(--main-pink);
            transition: 0.3s;
        }
        .notif-card:hover {
            box-shadow: 0 6px 15px rgba(226, 0, 90, 0.1);
            transform: translateY(-2px);
        }

        .notif-icon {
            background: linear-gradient(135deg, rgba(226, 0, 90, 0.1), rgba(255, 51, 119, 0.1));
            color: var(--main-pink);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .notif-body {
            flex-grow: 1;
        }

        .notif-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--dark-blue);
            margin: 0 0 5px 0;
        }

        .notif-text {
            font-size: 13px;
            color: var(--text-grey);
            margin: 0 0 10px 0;
            line-height: 1.5;
            font-weight: bold;
        }

        .notif-time {
            font-size: 11px;
            color: #a4b0be;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* কোনো নোটিফিকেশন না থাকলে (Empty State) */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            color: var(--text-grey);
        }
        .empty-state i {
            font-size: 60px;
            color: #dcdde1;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            font-size: 18px;
            color: #2c3e50;
            margin: 0 0 10px 0;
        }
        .empty-state p {
            font-size: 14px;
            margin: 0;
            max-width: 80%;
        }

        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: sticky; bottom: 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="header-title">Notifications</div>
            </div>
        </div>

        <div class="content" id="notificationContainer">
            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে নোটিফিকেশন লোড হবে -->
            <div class="empty-state">
                <i class="fas fa-bell-slash"></i>
                <h3>কোনো নোটিফিকেশন নেই</h3>
                <p>অ্যাডমিন থেকে কোনো নতুন আপডেট বা নোটিশ আসলে এখানে দেখতে পাবেন।</p>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ডেমো হিসেবে অ্যাডমিনের পাঠানো কিছু নোটিফিকেশন (পরে এটা অ্যাডমিন প্যানেল থেকে আসবে)
        const defaultAdminNotifications = [
            {
                title: "নতুন আপডেট! 🎉",
                message: "Send bKash অ্যাপে নতুন জিমেইল টাস্ক যুক্ত করা হয়েছে। এখনই কাজ শুরু করুন।",
                date: "আজ, সকাল ১০:৩০"
            },
            {
                title: "অফার চলছে! 🔥",
                message: "VIP প্যাকেজ কিনলেই পাচ্ছেন নিশ্চিত ৫০% ক্যাশব্যাক। অফারটি সীমিত সময়ের জন্য।",
                date: "গতকাল, বিকাল ৩:৪৫"
            }
        ];

        function renderNotifications() {
            const container = document.getElementById('notificationContainer');
            // অ্যাডমিন প্যানেল থেকে পাঠানো নোটিফিকেশন লোকাল স্টোরেজ থেকে ফেচ করবে
            let notifications = JSON.parse(localStorage.getItem('adminNotifications'));

            // যদি লোকাল স্টোরেজে কিছু না থাকে, তবে ডেমো ডাটা দেখাবে (চেক করার জন্য)
            if (!notifications || notifications.length === 0) {
                notifications = defaultAdminNotifications;
            }

            if (notifications.length > 0) {
                container.innerHTML = ''; // খালি করে নতুন করে লোড করা
                
                notifications.forEach(notif => {
                    container.innerHTML += `
                        <div class="notif-card">
                            <div class="notif-icon"><i class="fas fa-bell"></i></div>
                            <div class="notif-body">
                                <h4 class="notif-title">${notif.title}</h4>
                                <p class="notif-text">${notif.message}</p>
                                <div class="notif-time"><i class="far fa-clock"></i> ${notif.date}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                renderNotifications();
            }
        });
    </script>

</body>
</html>
