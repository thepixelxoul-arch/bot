<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --light-pink: #ff3377;
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
            --dark-blue: #2c3e50;
            --border-color: #dcdde1;
        }

        body, html { 
            margin: 0; padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .app-container { 
            width: 100%; max-width: 450px; height: 100vh; 
            background-color: var(--bg-light); color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; position: relative; 
            overflow: hidden; 
        }

        .header { 
            background-color: var(--main-pink); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--main-white); box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); z-index: 10; 
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; margin-left: 15px; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; transition: 0.2s; }

        .content { 
            flex-grow: 1; padding: 20px; 
            overflow-y: auto; 
            padding-bottom: 80px; 
            -webkit-overflow-scrolling: touch; 
        }

        /* ওয়ার্নিং নোটিশ (হলুদ রঙের) */
        .strict-warning-box {
            background-color: #fff9e6; 
            border: 1px solid #ffeeba; 
            border-left: 5px solid #ffc107;
            padding: 15px; border-radius: 8px; margin-bottom: 25px; 
            color: #856404; font-size: 13px; line-height: 1.6; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }
        .strict-warning-box h4 {
            margin: 0 0 8px 0; font-size: 15px; color: #d35400;
            display: flex; align-items: center; gap: 6px;
        }

        .verify-card {
            background-color: var(--main-white); border-radius: 12px; padding: 25px 20px;
            border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px; text-align: center;
        }

        /* এটিএম কার্ডের মতো বড় ফেস স্ক্যান বাটন */
        .scan-card-btn {
            width: 100%; height: 130px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink)); 
            color: white; border: none; border-radius: 15px; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            transition: all 0.3s ease; margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(226, 0, 90, 0.3);
            position: relative; overflow: hidden;
        }
        .scan-card-btn i { font-size: 40px; }
        
        /* সাকসেস স্টেট এখন সম্পূর্ণ পিংক! */
        .scan-card-btn.success {
            background: linear-gradient(135deg, var(--main-pink), var(--light-pink)); 
            box-shadow: 0 8px 20px rgba(226, 0, 90, 0.3);
            pointer-events: none; border: 2px solid white;
        }

        /* লাইভ ক্যামেরা কন্টেইনার */
        .camera-container {
            display: none; width: 100%; height: 250px; 
            border-radius: 15px; overflow: hidden; 
            border: 3px solid var(--main-pink); margin-bottom: 15px; 
            position: relative; background-color: #000;
            box-shadow: 0 5px 15px rgba(226, 0, 90, 0.2);
        }
        .camera-container video {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* ক্যামেরার উপর ফেস স্ক্যানিং এর মতো গ্রাডিয়েন্ট ফ্রেম */
        .camera-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(226, 0, 90, 0.6) 100%);
            pointer-events: none;
        }

        .capture-btn {
            display: none; background: white; color: var(--main-pink); 
            border: 2px solid var(--main-pink); padding: 12px; border-radius: 8px; 
            font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; 
            margin-bottom: 25px; transition: 0.2s;
        }
        .capture-btn:hover { background: var(--main-pink); color: white; }

        .fee-details {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #f8f9fa; padding: 15px; border-radius: 8px;
            border: 1px solid #eaeaea; margin-bottom: 15px; font-weight: bold;
            color: var(--dark-blue);
        }
        .fee-amount { font-size: 18px; color: var(--main-pink); }
        .fee-amount.free { color: var(--text-grey); text-decoration: line-through; margin-right: 5px; font-size: 14px;}

        .coupon-group {
            display: flex; gap: 10px; margin-bottom: 25px;
        }
        .coupon-input {
            flex: 1; padding: 12px 15px; 
            border: 1.5px solid #ffb8d2; background-color: #fffafb; 
            border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .coupon-input:focus { 
            border-color: var(--main-pink); background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(226, 0, 90, 0.1); 
        }
        
        .coupon-btn {
            background: var(--dark-blue); color: white; border: none;
            padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        .submit-btn {
            background-color: var(--main-pink); color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold;
            width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2);
        }
        .submit-btn:disabled { background: #dcdde1; cursor: not-allowed; box-shadow: none; }

        .bottom-nav { background-color: var(--main-white); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eaeaea; position: absolute; bottom: 0; width: 100%; z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); text-decoration: none; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }

        .toast-msg {
            visibility: hidden; min-width: 250px; background-color: var(--main-pink);
            color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
            position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%);
            top: 20px; font-size: 13px; font-weight: bold; line-height: 1.4;
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.4); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        .toast-msg.show { visibility: visible; opacity: 1; top: 40px; }
    </style>
</head>
<body>

    <div id="toastBox" class="toast-msg"></div>

    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <a href="profile.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="header-title">একাউন্ট ভেরিফিকেশন</div>
            </div>
        </div>

        <div class="content">
            <div class="strict-warning-box">
                <h4><i class="fas fa-exclamation-triangle"></i> জরুরি সতর্কতা</h4>
                অ্যাকাউন্ট ভেরিফিকেশন সম্পন্ন না করা পর্যন্ত আপনি <strong>কোনো কাজ (টাস্ক) বা উইথড্র</strong> করতে পারবেন না। প্ল্যাটফর্মের নিরাপত্তা নিশ্চিত করতে অবশ্যই নিচে ক্লিক করে আপনার নিজের ফেস স্ক্যান করুন।
            </div>

            <div class="verify-card">
                
                <!-- মেইন ফেস স্ক্যান বাটন -->
                <button class="scan-card-btn" id="scanBtn" onclick="openCamera()">
                    <i class="fas fa-camera"></i> 
                    <span>ফেস স্ক্যান করুন</span>
                </button>

                <!-- লাইভ ক্যামেরা ভিউ (লুকানো থাকবে প্রথমে) -->
                <div class="camera-container" id="cameraContainer">
                    <video id="videoFeed" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                </div>
                
                <!-- ছবি তোলার বাটন -->
                <button class="capture-btn" id="captureBtn" onclick="captureFace()">
                    <i class="fas fa-camera-retro"></i> ছবি তুলুন
                </button>

                <div class="fee-details">
                    <span>ভেরিফিকেশন ফি:</span>
                    <div>
                        <span id="oldFee" class="fee-amount" style="display:none;">৳২০</span>
                        <span id="feeAmount" class="fee-amount">৳২০</span>
                    </div>
                </div>

                <div class="coupon-group">
                    <input type="text" id="couponInput" class="coupon-input" placeholder="কুপন কোড (যদি থাকে)">
                    <button class="coupon-btn" onclick="applyCoupon()">Apply</button>
                </div>

                <button class="submit-btn" id="verifySubmitBtn" onclick="completeVerification()">৳২০ পেমেন্ট করুন</button>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <script>
        let isFaceScanned = false;
        let verifyFee = 20;
        let mediaStream = null;

        function showToast(message) {
            const toast = document.getElementById("toastBox");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        // ক্যামেরা চালু করার ফাংশন
        async function openCamera() {
            const btn = document.getElementById("scanBtn");
            const cameraContainer = document.getElementById("cameraContainer");
            const captureBtn = document.getElementById("captureBtn");
            const video = document.getElementById("videoFeed");

            try {
                // ব্রাউজার থেকে সামনের ক্যামেরা (Front Camera) অ্যাক্সেস নেওয়া
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = mediaStream;
                
                // বড় বাটন হাইড করে লাইভ ক্যামেরা এবং ছবি তোলার বাটন দেখানো
                btn.style.display = "none";
                cameraContainer.style.display = "block";
                captureBtn.style.display = "block";
                
            } catch (error) {
                console.error("Camera error:", error);
                alert("ক্যামেরা ওপেন করা যাচ্ছে না! আপনার ব্রাউজারে ক্যামেরার পারমিশন অন করুন।");
            }
        }

        // ছবি তোলার (ক্যামেরা বন্ধ করার) ফাংশন
        function captureFace() {
            const btn = document.getElementById("scanBtn");
            const cameraContainer = document.getElementById("cameraContainer");
            const captureBtn = document.getElementById("captureBtn");

            // ক্যামেরা স্ট্রিমিং বন্ধ করা
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            // ক্যামেরা হাইড করে আবার বাটনটি দেখানো (পিংক সাকসেস ডিজাইন সহ)
            cameraContainer.style.display = "none";
            captureBtn.style.display = "none";
            btn.style.display = "flex";
            
            isFaceScanned = true;
            btn.classList.add("success"); 
            btn.innerHTML = '<i class="fas fa-check-circle" style="font-size: 35px;"></i><span>ফেস স্ক্যান সম্পন্ন</span>';
            showToast("আপনার ফেস সফলভাবে স্ক্যান হয়েছে!");
        }

        function applyCoupon() {
            const couponCode = document.getElementById("couponInput").value.trim().toUpperCase();
            
            if(!couponCode) {
                showToast("দয়া করে কুপন কোড লিখুন!");
                return;
            }

            if(couponCode === "FREE20") {
                verifyFee = 0;
                document.getElementById("oldFee").style.display = "inline";
                document.getElementById("oldFee").classList.add("free");
                
                document.getElementById("feeAmount").innerText = "৳০ (ফ্রি)";
                document.getElementById("feeAmount").style.color = "var(--main-pink)"; // জিরো হলেও পিংক দেখাবে
                
                document.getElementById("verifySubmitBtn").innerText = "ফ্রি ভেরিফিকেশন সম্পন্ন করুন";
                
                showToast("কুপন সফলভাবে যুক্ত হয়েছে! ফি এখন ০ টাকা।");
            } else {
                showToast("ভুল কুপন কোড! আবার চেষ্টা করুন।");
            }
        }

        function completeVerification() {
            if(!isFaceScanned) {
                showToast("প্রথমে আপনার ফেস স্ক্যান সম্পন্ন করুন!");
                return;
            }

            const btn = document.getElementById("verifySubmitBtn");
            btn.disabled = true;
            btn.innerText = "প্রসেসিং হচ্ছে...";

            setTimeout(() => {
                if (verifyFee > 0) {
                    window.location.href = `payment.html?amount=${verifyFee}&vip=Verification`;
                } else {
                    alert("বিনামূল্যে আপনার একাউন্ট ভেরিফাই হয়েছে!");
                    window.location.href = "profile.html"; 
                }
            }, 800);
        }
    </script>
</body>
</html>
