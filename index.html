<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Farmer Web</title>
    <style>
        /* কালার ভেরিয়েবল (আপনার দেওয়া ছবির পিংক কালারটি এখানে সেট করা হয়েছে) */
        :root {
            --main-pink: #e2005a; 
            --main-white: #ffffff;
        }

        /* কম্পিউটারের ফুল স্ক্রিনের ব্যাকগ্রাউন্ড */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--main-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center; /* অ্যাপটিকে মাঝখানে রাখার জন্য */
        }

        /* মূল ওয়েবসাইটের সাইজ (মোবাইলের লেআউট) */
        .app-container {
            width: 100%;
            max-width: 450px; /* কম্পিউটারেও এর চেয়ে বড় হবে না */
            min-height: 100vh;
            background-color: var(--main-white);
            color: var(--main-pink);
            /* দুপাশে পিংক বর্ডার এবং হালকা শ্যাডো দিয়ে আলাদা করা হয়েছে */
            border-left: 2px solid var(--main-pink);
            border-right: 2px solid var(--main-pink);
            box-shadow: 0 0 15px rgba(226, 0, 90, 0.15); 
            display: flex;
            flex-direction: column;
        }

        /* উপরের হেডার */
        .header {
            background-color: var(--main-pink);
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--main-white);
        }

        /* মাঝখানের কন্টেন্ট এরিয়া */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto; /* কন্টেন্ট বেশি হলে স্ক্রল হবে */
        }

        /* কাজের বক্স */
        .task-box {
            background-color: var(--main-white);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--main-pink);
        }

        .task-box h3 {
            margin-top: 0;
            color: var(--main-pink);
            border-bottom: 1px dashed var(--main-pink);
            padding-bottom: 10px;
        }
        
        .task-box p {
            color: var(--main-pink);
            font-weight: 500;
            font-size: 16px;
        }

        /* বাটন ডিজাইন */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--main-pink);
            color: var(--main-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background-color: #c4004e; /* মাউস নিলে কালার সামান্য গাঢ় হবে */
        }

        /* একদম নিচের মেনু (Bottom Nav) */
        .bottom-nav {
            background-color: var(--main-pink);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
        }

        .nav-item {
            text-align: center;
            font-size: 14px;
            color: var(--main-white);
            opacity: 0.7; /* অন্যান্য বাটনগুলো একটু হালকা দেখাবে */
            cursor: pointer;
        }
        
        .nav-item.active {
            opacity: 1; /* সিলেক্ট করা বাটনটি উজ্জ্বল থাকবে */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            📧 Gmail Buy Panel
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Balance Card -->
            <div class="task-box" style="text-align: center;">
                <p style="margin: 0; font-weight: normal;">আপনার বর্তমান ব্যালেন্স</p>
                <h1 style="margin: 10px 0; font-size: 36px;">৳৫০.০০</h1>
            </div>

            <!-- Task Card -->
            <div class="task-box">
                <h3>➕ নতুন জিমেইল খুলুন</h3>
                <p><strong>নাম:</strong> John</p>
                <p><strong>পাসওয়ার্ড:</strong> Jony@@##</p>
                <p><strong>রেট:</strong> ৳৭.১৪</p>
                <button class="btn">কাজ জমা দিন</button>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">🏠<br>Home</div>
            <div class="nav-item">💸<br>Withdraw</div>
            <div class="nav-item">👥<br>Refer</div>
            <div class="nav-item">👤<br>Profile</div>
        </div>
    </div>

</body>
</html>
