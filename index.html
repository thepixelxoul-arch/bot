<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            height: 100vh; 
            background-color: var(--bg-light); 
            color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            overflow: hidden; 
        }

        .header { 
            background-color: var(--main-pink); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--main-white); 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); 
            z-index: 10; 
        }
        
        .header-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        /* লোগো অ্যানিমেশন */
        @keyframes flyingPlane {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
            50% { transform: translateY(-3px) translateX(2px) rotate(8deg); }
        }
        .header-title i {
            display: inline-block;
            animation: flyingPlane 2.5s infinite ease-in-out;
        }

        /* ব্যালেন্স এবং নোটিফিকেশন সেকশন */
        .header-auth { display: flex; gap: 15px; align-items: center; }

        .auth-btn { 
            background-color: var(--main-white); color: var(--main-pink); 
            padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; text-decoration: none; 
        }
        .auth-btn.register { background-color: #ffcc00; color: #333; }

        .header-balance { 
            background-color: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 4px; 
            font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; 
        }

        /* নোটিফিকেশন আইকন স্টাইল */
        .notification-btn {
            color: var(--main-white);
            font-size: 22px;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notification-btn:hover {
            transform: scale(1.1);
        }
        .notif-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ffcc00;
            color: var(--main-pink);
            font-size: 10px;
            font-weight: bold;
            min-width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            padding-bottom: 30px; 
        }
        
        /* স্লাইডার স্টাইল (আসল বিজ্ঞাপনের মতো বড় এবং আকর্ষণীয় পিংক গ্র্যাডিয়েন্ট) */
        .ad-slider-wrapper {
            background: linear-gradient(135deg, var(--main-pink), #ff3377); 
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(226, 0, 90, 0.3);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            width: 100%;
        }

        .ad-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ffcc00;
            color: #333;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .ad-slider-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); 
            width: 100%;
        }

        .ad-slide {
            min-width: 100%;
            box-sizing: border-box;
            padding: 35px 20px; /* প্যাডিং বাড়িয়ে ব্যানারটি বড় করা হয়েছে */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
        }

        .ad-icon-circle {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            min-width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ad-content-box h4 {
            font-size: 20px;
            font-weight: 900;
            color: white; 
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        .ad-content-box p {
            font-size: 14px;
            color: #ffe6f0; 
            margin: 0;
            font-weight: 600;
            line-height: 1.5;
            padding: 0 10px;
        }

        .section-title { color: #2c3e50; font-size: 16px; margin: 5px 0 15px 0; font-weight: bold; }
        .service-list { display: flex; flex-direction: column; gap: 12px; }
        
        /* VIP অপশন */
        .vip-card {
            background-color: var(--main-white); 
            border: 1px solid #eaeaea; 
            border-radius: 6px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px; 
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
        }
        .vip-left { color: #2c3e50; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .vip-left i { color: #f39c12; font-size: 22px; } 
        
        .vip-btn { 
            background-color: rgba(226, 0, 90, 0.1); 
            color: var(--main-pink); 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .vip-btn:hover { background-color: var(--main-pink); color: white; }

        /* সাধারণ কাজ কার্ড */
        .service-card { 
            background-color: var(--main-white); border: 1px solid #eaeaea; border-radius: 6px; 
            padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
        }
        .service-info { display: flex; align-items: center; gap: 15px; }
        
        .service-icon { width: 55px; height: 55px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; }
        .icon-gmail { background-color: #ea4335; } 
        .icon-wa { background-color: #25d366; } 
        .icon-tg { background-color: #0088cc; }
        .icon-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .icon-number { background-color: #8e44ad; } 
        
        .service-details h4 { margin: 0 0 4px 0; color: #2c3e50; font-size: 15px; }
        .service-details p { margin: 0; color: var(--main-pink); font-size: 13px; font-weight: bold; }

        .service-btn { 
            background-color: rgba(226, 0, 90, 0.1); color: var(--main-pink); border: none; 
            padding: 8px 15px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; 
            transition: all 0.2s;
        }
        .service-btn:hover { background-color: var(--main-pink); color: white; }

        /* বটম নেভবার */
        .bottom-nav { 
            background-color: var(--main-white); display: flex; justify-content: space-around; 
            padding: 10px 0; border-top: 1px solid #eaeaea; z-index: 100; 
        }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-grey); cursor: pointer; flex: 1; text-decoration: none; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--main-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <i class="fas fa-paper-plane"></i> Send bKash
            </div>
            
            <!-- ব্যালেন্স এবং নোটিফিকেশন সেকশন -->
            <div class="header-auth" id="authSection">
                <a href="login.html" class="auth-btn">Login</a>
                <a href="register.html" class="auth-btn register">Sign Up</a>

        <!-- Main Content -->
        <div class="content">

            <div class="ad-slider-wrapper" onclick="window.location.href='vip.html'">

                    <!-- জাভাস্ক্রিপ্ট দিয়ে স্লাইডগুলো এখানে তৈরি হবে -->

            <h3 class="section-title">কাজ নির্বাচন করুন</h3>
            
            <div class="service-list">

                    </div>
                    <button class="service-btn task-btn" onclick="window.location.href='gmail.html'">তৈরি করুন</button>
                </div>

                <!-- WhatsApp কার্ড -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-wa"><i class="fa-brands fa-whatsapp"></i></div>
                        <div class="service-details"><h4>WhatsApp Account</h4><p>রেট: ৳১৫.০০</p></div>
                    </div>
                    <button class="service-btn task-btn" onclick="window.location.href='whatsapp.html'">জমা দিন</button>
                </div>

                <!-- Telegram কার্ড -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-tg"><i class="fa-brands fa-telegram"></i></div>
                        <div class="service-details"><h4>Telegram Account</h4><p>রেট: ৳১২.০০</p></div>
                    </div>
                    <button class="service-btn task-btn" onclick="window.location.href='telegram.html'">জমা দিন</button>
                </div>

                <!-- Instagram কার্ড -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-ig"><i class="fa-brands fa-instagram"></i></div>
                        <div class="service-details"><h4>Instagram Account</h4><p>রেট: ৳১০.০০</p></div>
                    </div>
                    <button class="service-btn task-btn" onclick="window.location.href='instagram.html'">জমা দিন</button>
                </div>

                <!-- নাম্বার কিনুন কার্ড -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-number"><i class="fas fa-sim-card"></i></div>
                        <div class="service-details"><h4>নাম্বার কিনুন</h4><p>রেট: ৳৩.৮০</p></div>
                    </div>
                    <button class="service-btn task-btn" onclick="window.location.href='number.html'">কিনুন</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item protected-link"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item protected-link"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item protected-link"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById("authSection");
            const protectedLinks = document.querySelectorAll(".protected-link");
            const taskBtns = document.querySelectorAll(".task-btn");
            
            if (user) {
                authSection.innerHTML = `
                    <div class="header-balance"><i class="fas fa-wallet"></i> ৳৫০.০০</div>
                    <a href="#" class="notification-btn" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge">2</span>
                    </a>
                `;
            } else {
                authSection.innerHTML = `<a href="login.html" class="auth-btn">Login</a><a href="register.html" class="auth-btn register">Sign Up</a>`;
                
                protectedLinks.forEach(link => {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        window.location.href = "login.html";
                    });
                });

                taskBtns.forEach(btn => {
                    btn.removeAttribute("onclick");
                    btn.addEventListener("click", (e) => { 
                        e.preventDefault();
                        window.location.href = "login.html"; 
                    });
                });
            }
        });
    </script>

    <!-- বিজ্ঞাপন স্লাইডার অ্যানিমেশন লজিক -->
    <script>
        const ads = [
            { icon: "fa-crown", title: "VIP 1 স্পেশাল অফার", desc: "মাত্র ৳৯৯ টাকায় কিনুন! দৈনিক ২০টি জিমেইল ও ১০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 2 স্পেশাল অফার", desc: "মাত্র ৳১৯৯ টাকায় কিনুন! দৈনিক ৩০টি জিমেইল ও ২০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 3 স্পেশাল অফার", desc: "মাত্র ৳২৯৯ টাকায় কিনুন! দৈনিক ৪০টি জিমেইল ও ৩০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 4 স্পেশাল অফার", desc: "মাত্র ৳৩৯৯ টাকায় কিনুন! দৈনিক ৫০টি জিমেইল ও ৪০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 5 স্পেশাল অফার", desc: "মাত্র ৳৪৯৯ টাকায় কিনুন! দৈনিক ৬০টি জিমেইল ও ৫০টি ইনস্টাগ্রাম কাজ।" },
            { title: "VIP 6 স্পেশাল অফার", desc: "মাত্র ৳৫৯৯ টাকায় কিনুন! দৈনিক ৭০টি জিমেইল ও ৬০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 7 স্পেশাল অফার", desc: "মাত্র ৳৬৯৯ টাকায় কিনুন! দৈনিক ৮০টি জিমেইল ও ৭০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 8 স্পেশাল অফার", desc: "মাত্র ৳৭৯৯ টাকায় কিনুন! দৈনিক ৯০টি জিমেইল ও ৮০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 9 স্পেশাল অফার", desc: "মাত্র ৳৮৯৯ টাকায় কিনুন! দৈনিক ১০০টি জিমেইল ও ৯০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-crown", title: "VIP 10 স্পেশাল অফার", desc: "মাত্র ৳৯৯৯ টাকায় কিনুন! দৈনিক ১১০টি জিমেইল ও ১০০টি ইনস্টাগ্রাম কাজ।" },
            { icon: "fa-star", title: "Send bKash Member", desc: "মাত্র ৳২০০০ টাকায় কিনুন! দৈনিক ২০০টি জিমেইল ও ১৮০টি ইনস্টাগ্রাম কাজ।" }
        ];

        const track = document.getElementById('adSliderTrack');
        
        // ডাইনামিকভাবে স্লাইডগুলো তৈরি করা
        ads.forEach(ad => {
            const slide = document.createElement('div');
            slide.className = 'ad-slide';
            const iconClass = ad.icon ? ad.icon : "fa-crown"; // ডিফল্ট আইকন
            slide.innerHTML = `
                <div class="ad-icon-circle"><i class="fas ${iconClass}"></i></div>
                <div class="ad-content-box">
                    <h4>${ad.title}</h4>
                    <p>${ad.desc}</p>
                </div>
            `;
            track.appendChild(slide);
        });

        let currentAd = 0;
        
        function slideNext() {
            currentAd++;
            
            if (currentAd >= ads.length) {
                currentAd = 0;
                track.style.transition = 'none';
                track.style.transform = `translateX(0%)`;
                
                setTimeout(() => {
                    track.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';
                }, 50);
                return;
            }
            
            track.style.transform = `translateX(-${currentAd * 100}%)`;
        }

        setInterval(slideNext, 3500);
    </script>
</body>
</html>
