<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send bKash Web</title>
    <!-- প্রফেশনাল আইকনের জন্য FontAwesome যুক্ত করা হলো -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* কালার ভেরিয়েবল */
        :root {
            --main-pink: #e2005a; 
            --main-white: #ffffff;
            --text-grey: #888888;
            --bg-light: #f4f6f9; /* পেছনের ব্যাকগ্রাউন্ড কালার */
        }

        /* কম্পিউটারের ফুল স্ক্রিনের ব্যাকগ্রাউন্ড */
        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        /* মূল ওয়েবসাইটের সাইজ (মোবাইলের লেআউট) */
        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: var(--bg-light); /* ভেতরের কালার একটু অফ-হোয়াইট */
            color: var(--main-pink);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1); 
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* উপরের হেডার */
        .header {
            background-color: var(--main-pink);
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--main-white);
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2);
            z-index: 10;
        }
        
        .header i {
            margin-right: 8px;
        }

        /* মাঝখানের কন্টেন্ট এরিয়া */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* নোটিশ ব্যানার (নতুন) */
        .notice-banner {
            background-color: rgba(226, 0, 90, 0.08);
            color: var(--main-pink);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid var(--main-pink);
            display: flex;
            align-items: center;
        }
        .notice-banner i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* ড্যাশবোর্ড গ্রিড (নতুন) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--main-white);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(226, 0, 90, 0.08);
        }

        .stat-card h4 {
            margin: 10px 0 5px 0;
            font-size: 22px;
            color: #2c3e50;
        }

        .stat-card p {
            margin: 0;
            font-size: 13px;
            color: var(--text-grey);
            font-weight: 500;
        }

        /* কাজের বক্স (নতুন ডিজাইন) */
        .action-box {
            background-color: var(--main-white);
            padding: 25px 20px;
            border-radius: 12px;
            border: 2px dashed rgba(226, 0, 90, 0.4);
            box-shadow: 0 4px 15px rgba(226, 0, 90, 0.05);
            text-align: center;
        }

        .action-box h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 18px;
        }

        .action-box p {
            color: var(--text-grey);
            font-size: 14px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        /* বাটন ডিজাইন */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: var(--main-pink);
            color: var(--main-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn:hover {
            background-color: #c4004e;
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* একদম নিচের মেনু (Bottom Nav) */
        .bottom-nav {
            background-color: var(--main-white);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 15px 0;
            border-top: 1px solid #eaeaea;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: var(--text-grey);
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
        }
        
        .nav-item i {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
            transition: transform 0.2s;
        }
        
        .nav-item.active {
            color: var(--main-pink);
            font-weight: bold;
        }
        
        .nav-item.active i {
            transform: scale(1.15);
        }
        
        .nav-item:hover:not(.active) {
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <i class="fas fa-paper-plane"></i> Send bKash
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Notice Banner -->
            <div class="notice-banner">
                <i class="fas fa-bullhorn"></i>
                <div>
                    <strong>আপডেট:</strong> এখন প্রতিটি জিমেইলের জন্য ৭.৫০ টাকা দেওয়া হচ্ছে!
                </div>
            </div>

            <!-- Dashboard Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-wallet" style="color: var(--main-pink); font-size: 28px;"></i>
                    <h4>৳৫০.০০</h4>
                    <p>বর্তমান ব্যালেন্স</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle" style="color: #27ae60; font-size: 28px;"></i>
                    <h4>৭ টি</h4>
                    <p>অ্যাপ্রুভ হয়েছে</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock" style="color: #f39c12; font-size: 28px;"></i>
                    <h4>২ টি</h4>
                    <p>পেন্ডিং আছে</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-users" style="color: #2980b9; font-size: 28px;"></i>
                    <h4>৳১৫.০০</h4>
                    <p>রেফার ইনকাম</p>
                </div>
            </div>

            <!-- Action Card for New Task -->
            <div class="action-box">
                <h3>নতুন জিমেইল জমা দিন</h3>
                <p>কাজ শুরু করতে নিচের বাটনে ক্লিক করে নতুন নাম ও পাসওয়ার্ড সংগ্রহ করুন।</p>
                <button class="btn"><i class="fas fa-plus-circle"></i> নতুন কাজ নিন</button>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                Home
            </div>
            <div class="nav-item">
                <i class="fas fa-wallet"></i>
                Withdraw
            </div>
            <div class="nav-item">
                <i class="fas fa-users"></i>
                Refer
            </div>
            <div class="nav-item">
                <i class="fas fa-user"></i>
                Profile
            </div>
        </div>
    </div>

</body>
</html>
