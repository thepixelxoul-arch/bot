<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send bKash Web</title>
    <!-- প্রফেশনাল আইকনের জন্য FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* কালার ভেরিয়েবল */
        :root {
            --main-pink: #e2005a; 
            --main-white: #ffffff;
            --text-grey: #888888;
            --bg-light: #f4f6f9;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: var(--bg-light);
            color: var(--main-pink);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1); 
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* হেডার */
        .header {
            background-color: var(--main-pink);
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--main-white);
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2);
            z-index: 10;
        }
        
        .header i {
            margin-right: 8px;
        }

        /* কন্টেন্ট এরিয়া */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* নোটিশ ব্যানার */
        .notice-banner {
            background-color: rgba(226, 0, 90, 0.08);
            color: var(--main-pink);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid var(--main-pink);
            display: flex;
            align-items: center;
        }
        .notice-banner i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* ড্যাশবোর্ড গ্রিড */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--main-white);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(226, 0, 90, 0.08);
        }

        .stat-card h4 {
            margin: 10px 0 5px 0;
            font-size: 22px;
            color: #2c3e50;
        }

        .stat-card p {
            margin: 0;
            font-size: 13px;
            color: var(--text-grey);
            font-weight: 500;
        }

        /* নতুন সার্ভিস লিস্ট (Gmail, WhatsApp, Telegram) */
        .section-title {
            color: #2c3e50;
            font-size: 16px;
            margin: 5px 0 15px 0;
            font-weight: bold;
        }

        .service-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-card {
            background-color: var(--main-white);
            border: 1px solid #eaeaea;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }

        .service-card:hover {
            border-color: var(--main-pink);
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.08);
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .service-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        /* অরিজিনাল ব্র্যান্ড কালার */
        .icon-gmail { background-color: #ea4335; }
        .icon-wa { background-color: #25d366; }
        .icon-tg { background-color: #0088cc; }

        .service-details h4 {
            margin: 0 0 5px 0;
            color: #2c3e50;
            font-size: 16px;
        }

        .service-details p {
            margin: 0;
            color: var(--main-pink);
            font-size: 14px;
            font-weight: bold;
        }

        .service-btn {
            background-color: rgba(226, 0, 90, 0.1);
            color: var(--main-pink);
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .service-btn:hover {
            background-color: var(--main-pink);
            color: white;
        }

        /* বটম মেনু */
        .bottom-nav {
            background-color: var(--main-white);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 15px 0;
            border-top: 1px solid #eaeaea;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: var(--text-grey);
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
        }
        
        .nav-item i {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
            transition: transform 0.2s;
        }
        
        .nav-item.active {
            color: var(--main-pink);
            font-weight: bold;
        }
        
        .nav-item.active i {
            transform: scale(1.15);
        }
        
        .nav-item:hover:not(.active) {
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <i class="fas fa-paper-plane"></i> Send bKash
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Notice Banner -->
            <div class="notice-banner">
                <i class="fas fa-bullhorn"></i>
                <div>
                    <strong>আপডেট:</strong> এখন জিমেইলের পাশাপাশি হোয়াটসঅ্যাপ ও টেলিগ্রাম অ্যাকাউন্ট জমা দিয়েও টাকা ইনকাম করুন!
                </div>
            </div>

            <!-- Dashboard Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-wallet" style="color: var(--main-pink); font-size: 28px;"></i>
                    <h4>৳৫০.০০</h4>
                    <p>বর্তমান ব্যালেন্স</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle" style="color: #27ae60; font-size: 28px;"></i>
                    <h4>৭ টি</h4>
                    <p>অ্যাপ্রুভ হয়েছে</p>
                </div>
            </div>

            <!-- Service Selection Area -->
            <h3 class="section-title">কাজ নির্বাচন করুন</h3>
            
            <div class="service-list">
                
                <!-- Gmail Task -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-gmail">
                            <i class="fa-brands fa-google"></i>
                        </div>
                        <div class="service-details">
                            <h4>Gmail Account</h4>
                            <p>রেট: ৳৭.৫০</p>
                        </div>
                    </div>
                    <button class="service-btn">কাজ নিন</button>
                </div>

                <!-- WhatsApp Task -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-wa">
                            <i class="fa-brands fa-whatsapp"></i>
                        </div>
                        <div class="service-details">
                            <h4>WhatsApp Account</h4>
                            <p>রেট: ৳১৫.০০</p>
                        </div>
                    </div>
                    <button class="service-btn">কাজ নিন</button>
                </div>

                <!-- Telegram Task -->
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon icon-tg">
                            <i class="fa-brands fa-telegram"></i>
                        </div>
                        <div class="service-details">
                            <h4>Telegram Account</h4>
                            <p>রেট: ৳১২.০০</p>
                        </div>
                    </div>
                    <button class="service-btn">কাজ নিন</button>
                </div>

            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                Home
            </div>
            <div class="nav-item">
                <i class="fas fa-wallet"></i>
                Withdraw
            </div>
            <div class="nav-item">
                <i class="fas fa-users"></i>
                Refer
            </div>
            <div class="nav-item">
                <i class="fas fa-user"></i>
                Profile
            </div>
        </div>
    </div>

</body>
</html>
