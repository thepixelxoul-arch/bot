<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Farmer Web</title>
    <!-- প্রফেশনাল আইকনের জন্য FontAwesome যুক্ত করা হলো -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* কালার ভেরিয়েবল */
        :root {
            --main-pink: #e2005a; 
            --main-white: #ffffff;
            --text-grey: #888888;
            --bg-light: #f9f9f9;
        }

        /* কম্পিউটারের ফুল স্ক্রিনের ব্যাকগ্রাউন্ড */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light); /* বাইরের ব্যাকগ্রাউন্ড হালকা গ্রে */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        /* মূল ওয়েবসাইটের সাইজ (মোবাইলের লেআউট) */
        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: var(--main-white);
            color: var(--main-pink);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.08); /* প্রফেশনাল শ্যাডো */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* উপরের হেডার */
        .header {
            background-color: var(--main-pink);
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--main-white);
            box-shadow: 0 2px 10px rgba(226, 0, 90, 0.2);
        }
        
        .header i {
            margin-right: 8px;
        }

        /* মাঝখানের কন্টেন্ট এরিয়া */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--main-white);
        }

        /* কাজের বক্স */
        .task-box {
            background-color: var(--main-white);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1.5px solid rgba(226, 0, 90, 0.2);
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.05);
        }

        .task-box h3 {
            margin-top: 0;
            color: var(--main-pink);
            border-bottom: 1px dashed rgba(226, 0, 90, 0.3);
            padding-bottom: 10px;
            font-size: 18px;
        }
        
        .task-box h3 i {
            margin-right: 8px;
        }
        
        .task-box p {
            color: #333; /* ভেতরের টেক্সট ডার্ক গ্রে */
            font-weight: 500;
            font-size: 15px;
            margin: 10px 0;
        }
        
        .task-box p strong {
            color: var(--main-pink);
        }

        /* বাটন ডিজাইন */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--main-pink);
            color: var(--main-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s, transform 0.1s;
        }
        
        .btn:hover {
            background-color: #c4004e;
        }
        
        .btn:active {
            transform: scale(0.98); /* ক্লিক করলে হালকা চাপবে */
        }

        /* একদম নিচের মেনু (Bottom Nav) - সম্পূর্ণ নতুন ডিজাইন */
        .bottom-nav {
            background-color: var(--main-white);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 15px 0;
            border-top: 1px solid #eeeeee;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.03); /* উপরের দিকে হালকা শ্যাডো */
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: var(--text-grey); /* সাধারণ অবস্থায় গ্রে কালার */
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
        }
        
        .nav-item i {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
            transition: transform 0.2s;
        }
        
        /* সিলেক্ট করা বাটনটির ডিজাইন */
        .nav-item.active {
            color: var(--main-pink);
            font-weight: bold;
        }
        
        .nav-item.active i {
            transform: scale(1.1); /* আইকন একটু বড় হবে */
        }
        
        .nav-item:hover {
            color: var(--main-pink);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <i class="fas fa-envelope"></i> Gmail Buy Panel
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Balance Card -->
            <div class="task-box" style="text-align: center; border: 2px solid var(--main-pink);">
                <p style="margin: 0; color: var(--text-grey); font-weight: normal; font-size: 14px;">আপনার বর্তমান ব্যালেন্স</p>
                <h1 style="margin: 10px 0; font-size: 38px; color: var(--main-pink);">৳৫০.০০</h1>
            </div>

            <!-- Task Card -->
            <div class="task-box">
                <h3><i class="fas fa-plus-circle"></i> নতুন জিমেইল খুলুন</h3>
                <p><strong>নাম:</strong> John</p>
                <p><strong>পাসওয়ার্ড:</strong> Jony@@##</p>
                <p><strong>রেট:</strong> ৳৭.১৪</p>
                <button class="btn">কাজ জমা দিন</button>
            </div>

        </div>

        <!-- Bottom Navigation (সাদা ব্যাকগ্রাউন্ড, প্রফেশনাল আইকন) -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                Home
            </div>
            <div class="nav-item">
                <i class="fas fa-wallet"></i>
                Withdraw
            </div>
            <div class="nav-item">
                <i class="fas fa-users"></i>
                Refer
            </div>
            <div class="nav-item">
                <i class="fas fa-user"></i>
                Profile
            </div>
        </div>
    </div>

</body>
</html>
