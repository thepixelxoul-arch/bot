<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer - Send bKash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main-pink: #e2005a; 
            --main-white: #ffffff; 
            --text-grey: #888888; 
            --bg-light: #f4f6f9; 
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e9ecef; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            min-height: 100vh; 
            background-color: var(--bg-light); 
            color: var(--main-pink); 
            box-shadow: 0 0 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            box-sizing: border-box;
        }

        .header { 
            background-color: var(--main-pink); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--main-white); 
            box-shadow: 0 4px 12px rgba(226, 0, 90, 0.2); 
            z-index: 10; 
        }

        .header-title { 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            margin-right: 15px; 
            font-size: 22px; 
        }

        .content { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            padding-bottom: 30px;
        }

        .refer-card {
            background-color: var(--main-white);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .refer-card i {
            font-size: 45px;
            color: var(--main-pink);
            margin-bottom: 15px;
        }

        .refer-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 18px;
        }

        .refer-card p {
            margin: 0 0 20px 0;
            color: var(--text-grey);
            font-size: 13px;
            line-height: 1.4;
        }

        .refer-link-box {
            display: flex;
            background-color: #f1f2f6;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #dcdde1;
        }

        .refer-link-box input {
            flex-grow: 1;
            padding: 10px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 12px;
            color: #2c3e50;
            text-align: center;
        }

        /* ছোট এবং সুন্দর চারকোনা কপি বাটন */
        .copy-btn {
            background-color: var(--main-pink);
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            margin: 3px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: #c4004e;
        }

        .refer-stats {
            display: flex;
            background-color: var(--main-white);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-item:first-child {
            border-right: 1px solid #eaeaea;
        }

        .stat-item h3 {
            margin: 0 0 5px 0;
            color: var(--main-pink);
            font-size: 20px;
        }

        .stat-item p {
            margin: 0;
            color: var(--text-grey);
            font-size: 12px;
        }

        .bottom-nav { 
            background-color: var(--main-white); 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            border-top: 1px solid #eaeaea; 
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 10; 
        }

        .nav-item { 
            text-align: center; 
            font-size: 11px; 
            color: var(--text-grey); 
            cursor: pointer; 
            flex: 1; 
            text-decoration: none; 
        }

        .nav-item i { 
            font-size: 18px; 
            margin-bottom: 4px; 
            display: block; 
        }

        .nav-item.active { 
            color: var(--main-pink); 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                Refer
            </div>
            <div><i class="fas fa-users"></i></div>
        </div>

        <div class="content">
            
            <div class="refer-card">
                <i class="fas fa-user-plus"></i>
                <h3>বন্ধুদের রেফার করুন</h3>
                <p>আপনার রেফারেল লিংকের মাধ্যমে বন্ধুরা সাইনআপ করলে পেয়ে যান আকর্ষণীয় বোনাস!</p>
                
                <div class="refer-link-box">
                    <input type="text" id="referLink" value="https://send-bkash.web.app/register.html?ref=user123" readonly>
                    <button class="copy-btn" id="copyBtn">কপি</button>
                </div>
            </div>

            <div class="refer-stats">
                <div class="stat-item">
                    <h3 id="totalRefer">০ জন</h3>
                    <p>মোট রেফার</p>
                </div>
                <div class="stat-item">
                    <h3 id="referBonus">৳০.০০</h3>
                    <p>রেফার বোনাস</p>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
            <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet"></i>Withdraw</a>
            <a href="refer.html" class="nav-item active"><i class="fas fa-users"></i>Refer</a>
            <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
        </div>
    </div>

    <!-- Firebase Script & Refer Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzfS5v-5tKZZU0b94UllLDm_qQoumo5Bk",
            authDomain: "send-bkash.firebaseapp.com",
            projectId: "send-bkash",
            storageBucket: "send-bkash.firebasestorage.app",
            messagingSenderId: "306247423891",
            appId: "1:306247423891:web:bb4fb6634043e6755afa66",
            measurementId: "G-ZSRNS5RPV5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const refLink = `https://send-bkash.web.app/register.html?ref=${user.uid}`;
                document.getElementById("referLink").value = refLink;
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById("copyBtn").addEventListener("click", () => {
            const copyText = document.getElementById("referLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("রেফার লিংক কপি সফল হয়েছে!");
        });
    </script>
</body>
</html>
